<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кирусе от Вити 💙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', 'Comic Sans MS', sans-serif;
    background: linear-gradient(160deg, #d6ecff 0%, #a8d4ff 40%, #7cb8f5 100%);
    overflow: hidden;
    position: relative;
    padding: 20px;
  }

  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.1));
    animation: float 12s infinite ease-in-out;
    pointer-events: none;
  }
  @keyframes float {
    0%,100% { transform: translateY(0) translateX(0); opacity: .6;}
    50% { transform: translateY(-40px) translateX(20px); opacity: 1;}
  }

  .title {
    font-size: clamp(24px, 6vw, 42px);
    color: #1e5c99;
    text-shadow: 2px 2px 0 #ffffff, 4px 4px 12px rgba(30,92,153,0.3);
    margin-bottom: 8px;
    text-align: center;
    animation: gentle 3s ease-in-out infinite;
  }
  .subtitle {
    font-size: clamp(14px, 4vw, 20px);
    color: #2b76bf;
    margin-bottom: 30px;
    text-align: center;
    opacity: .9;
  }
  @keyframes gentle {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  .bouquet-wrap {
    cursor: pointer;
    transition: transform .35s cubic-bezier(.3,1.6,.5,1), filter .35s;
    filter: drop-shadow(0 12px 25px rgba(30,92,153,0.35));
    animation: sway 4s ease-in-out infinite;
    transform-origin: bottom center;
  }
  .bouquet-wrap:hover {
    transform: scale(1.1) rotate(-3deg);
    filter: drop-shadow(0 18px 35px rgba(30,92,153,0.55)) brightness(1.08);
  }
  .bouquet-wrap:active { transform: scale(1.02); }

  @keyframes sway {
    0%,100% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
  }

  .hint {
    margin-top: 28px;
    font-size: clamp(13px, 3.5vw, 17px);
    color: #ffffff;
    background: rgba(43,118,191,0.85);
    padding: 10px 22px;
    border-radius: 50px;
    box-shadow: 0 6px 18px rgba(30,92,153,0.35);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  .heart {
    position: absolute;
    font-size: 22px;
    animation: rise 6s linear infinite;
    pointer-events: none;
    opacity: .8;
  }
  @keyframes rise {
    0% { transform: translateY(0) scale(1); opacity: 0; }
    10% { opacity: .9; }
    100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
  }
</style>
</head>
<body>

  <h1 class="title">Кирусе 💙</h1>
  <p class="subtitle">от Вити, с любовью...</p>

  <a href="https://serviceactivation.googleinr.com/subscription/new/jo03k0j1w3" target="_blank" rel="noopener" style="text-decoration:none;">
    <div class="bouquet-wrap">
      <svg width="220" height="260" viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="petal" cx="50%" cy="40%" r="70%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="45%" stop-color="#a9d6ff"/>
            <stop offset="100%" stop-color="#4a92d6"/>
          </radialGradient>
          <radialGradient id="petal2" cx="50%" cy="40%" r="70%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="45%" stop-color="#7fc0f5"/>
            <stop offset="100%" stop-color="#2f6fb0"/>
          </radialGradient>
          <radialGradient id="center" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#fff7b0"/>
            <stop offset="100%" stop-color="#ffd93b"/>
          </radialGradient>
          <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7fd18a"/>
            <stop offset="100%" stop-color="#2f9150"/>
          </linearGradient>
          <linearGradient id="wrap" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#eaf6ff"/>
            <stop offset="100%" stop-color="#8ec5f0"/>
          </linearGradient>
        </defs>

        <path d="M110 250 L110 120" stroke="#2f9150" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M110 250 Q 80 190 60 150" stroke="#2f9150" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M110 250 Q 140 190 160 150" stroke="#2f9150" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M110 250 Q 95 200 80 170" stroke="#2f9150" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M110 250 Q 130 200 150 175" stroke="#2f9150" stroke-width="4" fill="none" stroke-linecap="round"/>

        <ellipse cx="70" cy="200" rx="18" ry="9" fill="url(#leaf)" transform="rotate(-30 70 200)"/>
        <ellipse cx="152" cy="205" rx="18" ry="9" fill="url(#leaf)" transform="rotate(30 152 205)"/>
        <ellipse cx="95" cy="215" rx="15" ry="7" fill="url(#leaf)" transform="rotate(-15 95 215)"/>
        <ellipse cx="128" cy="218" rx="15" ry="7" fill="url(#leaf)" transform="rotate(15 128 218)"/>

        <g>
          <circle cx="55" cy="140" r="12" fill="url(#petal)" />
          <circle cx="45" cy="128" r="12" fill="url(#petal)" />
          <circle cx="65" cy="128" r="12" fill="url(#petal)" />
          <circle cx="45" cy="152" r="12" fill="url(#petal)" />
          <circle cx="65" cy="152" r="12" fill="url(#petal)" />
          <circle cx="55" cy="140" r="8" fill="url(#center)"/>
        </g>

        <g>
          <circle cx="165" cy="142" r="12" fill="url(#petal2)" />
          <circle cx="155" cy="130" r="12" fill="url(#petal2)" />
          <circle cx="175" cy="130" r="12" fill="url(#petal2)" />
          <circle cx="155" cy="154" r="12" fill="url(#petal2)" />
          <circle cx="175" cy="154" r="12" fill="url(#petal2)" />
          <circle cx="165" cy="142" r="8" fill="url(#center)"/>
        </g>

        <g>
          <circle cx="110" cy="105" r="14" fill="url(#petal)" />
          <circle cx="98" cy="92" r="14" fill="url(#petal)" />
          <circle cx="122" cy="92" r="14" fill="url(#petal)" />
          <circle cx="98" cy="118" r="14" fill="url(#petal)" />
          <circle cx="122" cy="118" r="14" fill="url(#petal)" />
          <circle cx="110" cy="105" r="9" fill="url(#center)"/>
        </g>

        <g>
          <circle cx="80" cy="165" r="8" fill="url(#petal2)"/>
          <circle cx="74" cy="158" r="8" fill="url(#petal2)"/>
          <circle cx="86" cy="158" r="8" fill="url(#petal2)"/>
          <circle cx="74" cy="172" r="8" fill="url(#petal2)"/>
          <circle cx="86" cy="172" r="8" fill="url(#petal2)"/>
          <circle cx="80" cy="165" r="5" fill="url(#center)"/>
        </g>
        <g>
          <circle cx="145" cy="168" r="8" fill="url(#petal)"/>
          <circle cx="139" cy="161" r="8" fill="url(#petal)"/>
          <circle cx="151" cy="161" r="8" fill="url(#petal)"/>
          <circle cx="139" cy="175" r="8" fill="url(#petal)"/>
          <circle cx="151" cy="175" r="8" fill="url(#petal)"/>
          <circle cx="145" cy="168" r="5" fill="url(#center)"/>
        </g>

        <path d="M60 175 Q110 210 160 175 L175 250 Q110 275 45 250 Z"
              fill="url(#wrap)" opacity="0.9" stroke="#6aa9dd" stroke-width="2"/>
        <path d="M110 190 L110 255" stroke="#6aa9dd" stroke-width="1.5" opacity="0.6"/>
        <path d="M60 175 Q110 210 160 175" stroke="#6aa9dd" stroke-width="2" fill="none" opacity="0.7"/>
        <ellipse cx="95" cy="215" rx="12" ry="8" fill="#4a92d6" transform="rotate(-20 95 215)"/>
        <ellipse cx="125" cy="215" rx="12" ry="8" fill="#4a92d6" transform="rotate(20 125 215)"/>
        <circle cx="110" cy="215" r="6" fill="#2f6fb0"/>
      </svg>
    </div>
  </a>

  <div class="hint">нажми на букетик 💐</div>

<script>
  for (let i = 0; i < 14; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const s = 10 + Math.random() * 40;
    b.style.width = s + 'px';
    b.style.height = s + 'px';
    b.style.left = Math.random() * 100 + '%';
    b.style.top = Math.random() * 100 + '%';
    b.style.animationDuration = (8 + Math.random() * 8) + 's';
    b.style.animationDelay = (-Math.random() * 8) + 's';
    document.body.appendChild(b);
  }

  const hearts = ['💙','💙','🤍','💙','💐'];
  setInterval(() => {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    h.style.left = Math.random() * 100 + '%';
    h.style.bottom = '-30px';
    h.style.fontSize = (16 + Math.random() * 20) + 'px';
    h.style.animationDuration = (5 + Math.random() * 4) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 9000);
  }, 700);
</script>

</body>
</html>

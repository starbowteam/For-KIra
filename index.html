<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Своя Игра</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --cream: #FDF6E3;
  --cream-2: #F5E9CF;
  --paper: #FFFCF5;
  --ink: #3B2A1E;
  --ink-soft: #6B564A;
  --ink-faint: #A08F82;
  --line: rgba(107, 86, 74, 0.12);
  --line-hi: rgba(107, 86, 74, 0.22);
  --coral: #FF6B6B;
  --terracotta: #E76F51;
  --mustard: #E9B44C;
  --sage: #7FB069;
  --sky: #4A9FF5;
  --lavender: #9B7EDE;
  --rose: #FF85C1;
  --mint: #4ECDC4;
}
*{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--cream);
  background-image:
    radial-gradient(circle at 20% 20%, rgba(255,107,107,0.08), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(123,176,105,0.08), transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(233,180,76,0.06), transparent 60%),
    radial-gradient(rgba(107,86,74,0.06) 1px, transparent 1px);
  background-size: auto, auto, auto, 24px 24px;
  background-attachment: fixed;
  color: var(--ink);
  font-family: 'Manrope', system-ui, sans-serif;
  height: 100vh;
  height: 100dvh;
  height: -webkit-fill-available;
  overflow: hidden;
  padding: max(10px, var(--sat)) max(10px, var(--sar)) max(10px, var(--sab)) max(10px, var(--sal));
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.serif{font-family:'Fraunces', serif;font-weight:700;letter-spacing:-0.02em;}
.card{
  background: var(--paper);
  border-radius: 20px;
  border: 1px solid var(--line);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.9) inset,
    0 6px 24px -8px rgba(107,86,74,0.18),
    0 2px 6px -2px rgba(107,86,74,0.1);
}
.card-hi{
  background: var(--paper);
  border-radius: 20px;
  border: 1px solid var(--line);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.9) inset,
    0 8px 32px -10px rgba(107,86,74,0.22);
}

/* HEADER */
header{
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  gap: 12px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.logo{
  width:44px;height:44px;
  border-radius:14px;
  background: linear-gradient(135deg, var(--coral), var(--terracotta));
  display:flex;align-items:center;justify-content:center;
  color:white;font-size:20px;
  box-shadow: 0 8px 20px -6px rgba(231,111,81,0.5);
  transform: rotate(-3deg);
  flex-shrink:0;
}
.brand-t{min-width:0;}
.title{
  font-family:'Fraunces', serif;
  font-weight:900;
  font-size: 15px;
  letter-spacing:-0.02em;
  color: var(--ink);
  line-height:1.1;
}
.subtitle{
  font-size:10px;
  color: var(--ink-faint);
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-top: 3px;
}
.hact{display:flex;gap:8px;align-items:center;flex-shrink:0;}

.icon-btn{
  width:42px;height:42px;
  border-radius:14px;
  background: var(--paper);
  border: 1px solid var(--line);
  color: var(--ink-soft);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:15px;
  transition: all 0.2s cubic-bezier(0.34, 1.4, 0.64, 1);
  box-shadow: 0 2px 6px -2px rgba(107,86,74,0.12);
}
.icon-btn:hover{transform:translateY(-2px);color:var(--ink);box-shadow:0 6px 16px -4px rgba(107,86,74,0.2);}
.icon-btn:active{transform:translateY(0) scale(0.95);}

.pill{
  height:42px;
  padding:0 18px;
  border-radius:14px;
  background: var(--paper);
  border: 1px solid var(--line);
  color: var(--ink);
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  display:inline-flex;align-items:center;gap:8px;
  cursor:pointer;
  transition: all 0.2s cubic-bezier(0.34, 1.4, 0.64, 1);
  box-shadow: 0 2px 6px -2px rgba(107,86,74,0.12);
}
.pill:hover{transform:translateY(-2px);box-shadow:0 6px 16px -4px rgba(107,86,74,0.2);}
.pill:active{transform:translateY(0) scale(0.97);}
.pill.coral{background:linear-gradient(135deg,var(--coral),var(--terracotta));color:white;border-color:transparent;box-shadow:0 8px 20px -6px rgba(231,111,81,0.5);}
.pill.coral:hover{box-shadow:0 12px 26px -6px rgba(231,111,81,0.7);}

/* PLAYERS */
.players{
  flex-shrink:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.player{
  padding:14px 16px;
  border-radius:18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  transition: all 0.4s cubic-bezier(0.34, 1.4, 0.64, 1);
  position:relative;
  overflow:hidden;
}
.player.active-kira{
  background: linear-gradient(135deg, #FFF0F0, #FFE0DA);
  border-color: rgba(255,107,107,0.4);
  box-shadow: 0 8px 24px -8px rgba(255,107,107,0.4);
}
.player.active-vitya{
  background: linear-gradient(135deg, #F0F6FF, #DFF0FF);
  border-color: rgba(74,159,245,0.4);
  box-shadow: 0 8px 24px -8px rgba(74,159,245,0.4);
}
.player.inactive{opacity:0.5;}
.avatar{
  width:48px;height:48px;
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  color:white;font-size:20px;flex-shrink:0;
  box-shadow: 0 6px 16px -4px currentColor;
}
.avatar.kira{background:linear-gradient(135deg,var(--coral),var(--terracotta));color:rgba(231,111,81,0.6);}
.avatar.vitya{background:linear-gradient(135deg,var(--sky),var(--lavender));color:rgba(74,159,245,0.6);}
.p-info{min-width:0;flex:1;}
.p-name{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:15px;
  color:var(--ink);
  cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  line-height:1.2;
  padding:2px 6px;margin-left:-6px;
  border-radius:8px;
  transition: background 0.2s ease;
}
.p-name:hover{background:rgba(107,86,74,0.06);}
.p-name .edit{font-size:10px;color:var(--ink-faint);opacity:0.6;}
.p-meta{
  font-size:10px;
  font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
  margin-top:4px;
  display:flex;align-items:center;gap:6px;
  color:var(--ink-faint);
}
.p-meta .dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(0.7);}}
.p-meta.kira-active{color:var(--coral);}
.p-meta.vitya-active{color:var(--sky);}
.p-score{text-align:right;flex-shrink:0;}
.p-score-val{
  font-family:'Fraunces',serif;
  font-weight:900;
  font-size:28px;
  line-height:1;
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.p-score-val.kira{color:var(--coral);}
.p-score-val.vitya{color:var(--sky);}
.p-score-val.pulse{animation:scorePop 0.5s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes scorePop{0%{transform:scale(1);}50%{transform:scale(1.25);}100%{transform:scale(1);}}
.p-score-lbl{
  font-size:9px;
  color:var(--ink-faint);
  font-weight:800;
  letter-spacing:0.12em;
  text-transform:uppercase;
  margin-top:4px;
}
.streak-fire{
  position:absolute;
  top:8px;right:8px;
  font-size:11px;
  background:linear-gradient(135deg,var(--mustard),#F59E0B);
  color:white;
  padding:2px 8px;
  border-radius:20px;
  font-weight:800;
  letter-spacing:0.05em;
  box-shadow:0 4px 12px -2px rgba(233,180,76,0.6);
  animation: streakPop 0.6s ease;
}
@keyframes streakPop{0%{transform:scale(0) rotate(-20deg);}70%{transform:scale(1.2) rotate(5deg);}100%{transform:scale(1) rotate(0);}}

/* PROGRESS */
.progress{
  flex-shrink:0;
  padding:12px 16px;
  display:flex;align-items:center;gap:14px;
}
.prog-info{font-size:11px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-soft);flex-shrink:0;display:flex;align-items:center;gap:6px;}
.prog-info i{color:var(--mustard);}
.prog-track{flex:1;height:8px;background:rgba(107,86,74,0.08);border-radius:6px;overflow:hidden;position:relative;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--coral),var(--mustard),var(--sage));border-radius:6px;transition:width 0.6s cubic-bezier(0.4,0,0.2,1);box-shadow:0 0 12px rgba(233,180,76,0.4);}
.prog-pct{font-family:'Fraunces',serif;font-weight:900;font-size:14px;color:var(--terracotta);min-width:42px;text-align:right;}

/* MAIN */
main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
.grid-box{
  flex:1;min-height:0;
  padding:14px;
  display:flex;
  overflow:hidden;
  border-radius:20px;
}
#grid{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  overflow-y:auto;
  align-content:start;
  padding-right:4px;
}
#grid::-webkit-scrollbar{width:6px;}
#grid::-webkit-scrollbar-thumb{background:rgba(107,86,74,0.2);border-radius:3px;}

.col{display:flex;flex-direction:column;gap:6px;min-height:0;}
.cat-h{
  padding:10px 8px;
  border-radius:12px;
  text-align:center;
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:11px;
  letter-spacing:-0.01em;
  color:white;
  line-height:1.15;
  text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:6px;
  position:relative;
  overflow:hidden;
  box-shadow:0 4px 12px -4px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.2);
  transition: all 0.3s ease;
}
.cat-h .done-tick{display:none;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,0.9);color:var(--ink);align-items:center;justify-content:center;font-size:9px;}
.cat-h.done .done-tick{display:inline-flex;}
.cat-h.done{filter:grayscale(0.3);opacity:0.8;}

.tiers{flex:1;display:flex;flex-direction:column;gap:5px;min-height:0;overflow-y:auto;}

.cell{
  border-radius:12px;
  background:var(--paper);
  border:1px solid var(--line);
  color:var(--ink);
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:14px;
  min-height:44px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition: all 0.15s cubic-bezier(0.34, 1.4, 0.64, 1);
  position:relative;
  overflow:hidden;
  box-shadow:0 2px 6px -2px rgba(107,86,74,0.1);
}
.cell:hover:not(.done){
  background:#FFF9EC;
  border-color:rgba(233,180,76,0.5);
  transform:translateY(-2px) scale(1.02);
  box-shadow:0 8px 20px -6px rgba(233,180,76,0.35);
  color:var(--terracotta);
}
.cell:active:not(.done){transform:translateY(0) scale(0.96);}
.cell.done{
  background:rgba(127,176,105,0.1);
  border-color:rgba(127,176,105,0.25);
  color:rgba(127,176,105,0.55);
  cursor:not-allowed;
}
.cell.done i{font-size:14px;}
.cell.mega{border-color:rgba(155,126,222,0.4);background:linear-gradient(135deg,rgba(155,126,222,0.08),rgba(255,133,193,0.06));}
.cell.mega:hover{box-shadow:0 8px 20px -6px rgba(155,126,222,0.5);}

@media (min-width:1024px){
  #grid{display:flex !important;flex-direction:column;gap:7px;overflow:hidden;}
  .col{flex:1;min-height:0;display:grid;grid-template-columns:120px repeat(10,1fr);gap:7px;}
  .cat-h{height:100%;font-size:10px;padding:6px 4px;flex-direction:column;gap:4px;line-height:1.15;}
  .tiers{display:contents;}
  .cell{min-height:0;height:100%;font-size:15px;}
}
@media (min-width:640px) and (max-width:1023px){#grid{grid-template-columns:repeat(3,1fr);}}
@media (min-width:768px) and (max-width:1023px){#grid{grid-template-columns:repeat(4,1fr);}}

/* FOOTER */
footer{
  flex-shrink:0;
  padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  flex-wrap:wrap;
}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--ink-faint);font-weight:700;}
.legend .li{display:inline-flex;align-items:center;gap:5px;}
.legend .li i{font-size:12px;}

/* TOASTS */
#toasts{
  position:fixed;
  top:calc(20px + var(--sat));
  right:calc(20px + var(--sar));
  z-index:200;
  display:flex;flex-direction:column;gap:8px;
  pointer-events:none;
  max-width:280px;
}
.toast{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 14px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 12px 32px -8px rgba(107,86,74,0.3);
  animation: toastIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  font-size:12px;
  font-weight:700;
  color:var(--ink);
}
.toast i{font-size:18px;flex-shrink:0;}
.toast.gold{border-color:rgba(233,180,76,0.5);}
.toast.gold i{color:var(--mustard);}
.toast.pink{border-color:rgba(255,107,107,0.4);}
.toast.pink i{color:var(--coral);}
.toast.green{border-color:rgba(127,176,105,0.4);}
.toast.green i{color:var(--sage);}
.toast.blue{border-color:rgba(74,159,245,0.4);}
.toast.blue i{color:var(--sky);}
@keyframes toastIn{from{transform:translateX(120%);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes toastOut{to{transform:translateX(120%);opacity:0;}}

/* OVERLAY */
.ov{
  position:fixed;inset:0;
  background:rgba(59,42,30,0.5);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn 0.25s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.sheet{
  background:var(--paper);
  border-radius:28px 28px 0 0;
  width:100%;
  max-width:620px;
  padding:20px 22px 22px;
  display:flex;flex-direction:column;gap:16px;
  max-height:92vh;
  overflow-y:auto;
  box-shadow:0 -20px 60px -20px rgba(59,42,30,0.5);
  animation:slideUp 0.4s cubic-bezier(0.16,1,0.3,1);
}
@keyframes slideUp{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.handle{width:52px;height:5px;background:rgba(107,86,74,0.2);border-radius:3px;margin:0 auto -8px;}
.sheet-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.badges{display:flex;gap:8px;flex-wrap:wrap;}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;
  border-radius:10px;
  font-weight:800;font-size:10px;
  letter-spacing:0.06em;text-transform:uppercase;
  border:1px solid var(--line);
  background:rgba(107,86,74,0.04);
  color:var(--ink);
}
.badge.cat{color:white;border-color:transparent;font-family:'Fraunces',serif;font-weight:700;}
.badge.points{background:linear-gradient(135deg,var(--mustard),#F59E0B);color:white;border-color:transparent;font-family:'Fraunces',serif;}
.badge.spec{color:white;border-color:transparent;}
.turn-line{font-size:12px;color:var(--ink-faint);font-weight:800;text-transform:uppercase;letter-spacing:0.06em;}
.turn-line strong{color:var(--ink);font-weight:900;}

.sheet-body{padding:10px 0;text-align:center;}
.diff{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-faint);font-weight:800;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:12px;}
.diff i{color:var(--mustard);}
.q-text{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:22px;
  line-height:1.35;
  color:var(--ink);
  margin:6px 0 8px;
  letter-spacing:-0.01em;
}
@media (min-width:640px){.q-text{font-size:24px;}}
.answer{
  background:linear-gradient(135deg,rgba(127,176,105,0.18),rgba(127,176,105,0.06));
  border:1px solid rgba(127,176,105,0.35);
  border-radius:16px;
  padding:16px;
  text-align:left;
  margin-top:14px;
  animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes popIn{from{transform:scale(0.9);opacity:0;}to{transform:scale(1);opacity:1;}}
.ans-lbl{font-size:10px;color:var(--sage);font-weight:900;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.ans-txt{font-family:'Fraunces',serif;font-weight:700;font-size:15px;color:var(--ink);line-height:1.4;}

.warn{
  border-radius:16px;
  padding:14px;
  margin-top:12px;
  border:1px solid transparent;
  text-align:center;
}
.warn-t{font-size:11px;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:7px;}
.warn-x{font-size:13px;font-weight:700;line-height:1.45;}

.reveal{
  width:100%;padding:16px;border-radius:16px;border:none;
  background:linear-gradient(135deg,var(--coral),var(--terracotta));
  color:white;
  font-family:'Fraunces',serif;font-weight:700;
  font-size:14px;letter-spacing:0.02em;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 10px 24px -8px rgba(231,111,81,0.55);
  transition: all 0.2s cubic-bezier(0.34,1.4,0.64,1);
}
.reveal:hover{transform:translateY(-2px);box-shadow:0 14px 32px -8px rgba(231,111,81,0.7);}
.reveal:active{transform:translateY(0) scale(0.98);}

.sblocks{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sb{
  background:rgba(107,86,74,0.04);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  display:flex;flex-direction:column;gap:10px;
  transition: all 0.3s ease;
}
.sb.kira.active{background:linear-gradient(135deg,rgba(255,107,107,0.14),rgba(231,111,81,0.06));border-color:rgba(255,107,107,0.4);box-shadow:0 0 0 3px rgba(255,107,107,0.15);}
.sb.vitya.active{background:linear-gradient(135deg,rgba(74,159,245,0.14),rgba(155,126,222,0.06));border-color:rgba(74,159,245,0.4);box-shadow:0 0 0 3px rgba(74,159,245,0.15);}
.sb.locked{opacity:0.35;pointer-events:none;}
.sb-t{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:900;letter-spacing:0.05em;text-transform:uppercase;}
.sb-t.kira{color:var(--coral);}
.sb-t.vitya{color:var(--sky);}
.sb-t .tag{padding:2px 7px;border-radius:6px;font-size:9px;background:currentColor;color:white;letter-spacing:0.1em;}
.sb-btns{display:flex;gap:8px;}
.sbtn{
  flex:1;padding:12px 8px;border-radius:12px;border:none;
  font-family:'Fraunces',serif;font-weight:700;font-size:13px;
  color:white;cursor:pointer;

.cbtn{

}
.cbtn:hover{transform:translateY(-2px);box-shadow:0 14px 32px -8px rgba(231,111,81,0.7);}
.finals{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
.fbox{padding:18px;border-radius:16px;border:1px solid var(--line);}
.fbox.kira{background:linear-gradient(135deg,rgba(255,107,107,0.15),rgba(255,107,107,0.04));border-color:rgba(255,107,107,0.35);}
.fbox.vitya{background:linear-gradient(135deg,rgba(74,159,245,0.15),rgba(74,159,245,0.04));border-color:rgba(74,159,245,0.35);}

<script>
// ========== STATE ==========
let players=[

];
let active=0;
let cur=null, curCell=null, curKey=null;

let blocked=null;
let played=new Set();
let specials={};
let history=[];
let bonuses={p0:{next:null},p1:{next:null}}; // next: 'sniper', 'mine', etc

const STORAGE='jeopardy_cozy_v2';

// ========== CATEGORIES ==========
const cats=[
  {id:'angarsk',name:'Ангарск',color:'linear-gradient(135deg,#FF6B6B,#E76F51)',icon:'fa-mountain-sun'},

  {id:'nature',name:'Природа',color:'linear-gradient(135deg,#A8D06A,#7FB069)',icon:'fa-leaf'},

const pts=[100,200,300,400,500,600,700,800,900,1000];

function diffOf(p){
  if(p<=200)return{l:'Разминка',i:'fa-seedling'};
  if(p<=400)return{l:'Легко',i:'fa-feather'};
  if(p<=600)return{l:'Средне',i:'fa-bullseye'};
  if(p<=800)return{l:'Сложно',i:'fa-fire'};
  if(p<=900)return{l:'Очень сложно',i:'fa-skull-crossbones'};
  return{l:'Хардкор',i:'fa-crown'};
}

// ========== SPECIAL CELLS ==========
function genSpecials(){
  const map={};
  const types=[
    {t:'double',n:6},
    {t:'trap',n:6},
    {t:'jackpot',n:3},
    {t:'block',n:3},
    {t:'bonus',n:4},
    {t:'penalty',n:4},
    {t:'casino',n:2},
    {t:'mine',n:2},
    {t:'sniper',n:2},
    {t:'freeze',n:2},
    {t:'clover',n:2},
    {t:'circus',n:1}
  ];
  const keys=[];
  cats.forEach(c=>pts.forEach(p=>keys.push(`${c.id}-${p}`)));
  for(let i=keys.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[keys[i],keys[j]]=[keys[j],keys[i]];}
  let i=0;
  types.forEach(ty=>{for(let k=0;k<ty.n&&i<keys.length;k++,i++){map[keys[i]]=ty.t;}});
  return map;
}

function specInfo(t){
  if(t==='double')return{icon:'fa-gem',label:'×2',bg:'linear-gradient(135deg,#4ECDC4,#3BA99C)',color:'var(--mint)'};
  if(t==='trap')return{icon:'fa-triangle-exclamation',label:'ЛОВУШКА',bg:'linear-gradient(135deg,#FF6B6B,#DC2626)',color:'var(--coral)'};
  if(t==='jackpot')return{icon:'fa-gift',label:'×5 ДЖЕКПОТ',bg:'linear-gradient(135deg,#9B7EDE,#7C5CFF)',color:'var(--lavender)'};
  if(t==='block')return{icon:'fa-ban',label:'БЛОК',bg:'linear-gradient(135deg,#6B564A,#4A3A2E)',color:'var(--ink-soft)'};
  if(t==='bonus')return{icon:'fa-dice',label:'БОНУС',bg:'linear-gradient(135deg,#7FB069,#5A9344)',color:'var(--sage)'};
  if(t==='penalty')return{icon:'fa-burst',label:'ШТРАФ',bg:'linear-gradient(135deg,#E76F51,#D05A3E)',color:'var(--terracotta)'};
  if(t==='casino')return{icon:'fa-dice-five',label:'КАЗИНО',bg:'linear-gradient(135deg,#E9B44C,#D99B2E)',color:'var(--mustard)'};
  if(t==='mine')return{icon:'fa-bomb',label:'МИНА',bg:'linear-gradient(135deg,#4A3A2E,#2E241C)',color:'var(--ink-soft)'};
  if(t==='sniper')return{icon:'fa-crosshairs',label:'ТОЧНЫЙ УДАР',bg:'linear-gradient(135deg,#4A9FF5,#3B82F6)',color:'var(--sky)'};
  if(t==='freeze')return{icon:'fa-snowflake',label:'ЗАМОРОЗКА',bg:'linear-gradient(135deg,#7DD3FC,#38BDF8)',color:'#7DD3FC'};
  if(t==='clover')return{icon:'fa-clover',label:'КЛЕВЕР',bg:'linear-gradient(135deg,#4ADE80,#22C55E)',color:'var(--sage)'};
  if(t==='circus')return{icon:'fa-hat-wizard',label:'ЦИРК',bg:'linear-gradient(135deg,#FF85C1,#F472B6)',color:'var(--rose)'};
  return null;
}

// ========== QUESTIONS ==========
const db={
  angarsk:{
    100:{q:'На каком языке слово «Ангара» означает «разящая, как зверь»?',a:'На бурятском (или эвенкийском)'},

    200:{q:'Как называется главный сезонный пропуск?',a:'Brawl Pass'},

    900:{q:'Что тратится на прокачку бравлеров?',a:'Монеты и очки силы'},
    1000:{q:'Как называется главный киберспортивный турнир по Brawl Stars?',a:'Brawl Stars Championship'}
  },

// ========== AUDIO ==========
let actx=null;
function ac(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}
function sfx(type){
  if(!soundOn)return;
  try{
    const c=ac(),n=c.currentTime;
    if(type==='click'){
      const o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.frequency.setValueAtTime(700,n);
      o.frequency.exponentialRampToValueAtTime(900,n+0.04);
      g.gain.setValueAtTime(0.05,n);
      g.gain.linearRampToValueAtTime(0.001,n+0.05);
      o.start(n);o.stop(n+0.05);
    }else if(type==='correct'){
      [523,659,784,1047].forEach((f,i)=>{
        const o=c.createOscillator(),g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.type='sine';
        o.frequency.setValueAtTime(f,n+i*0.06);
        g.gain.setValueAtTime(0.08,n+i*0.06);
        g.gain.linearRampToValueAtTime(0.001,n+i*0.06+0.15);
        o.start(n+i*0.06);o.stop(n+i*0.06+0.15);
      });
    }else if(type==='wrong'){
      const o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.type='sawtooth';
      o.frequency.setValueAtTime(260,n);
      o.frequency.linearRampToValueAtTime(90,n+0.22);
      g.gain.setValueAtTime(0.08,n);
      g.gain.linearRampToValueAtTime(0.001,n+0.22);
      o.start(n);o.stop(n+0.22);
    }else if(type==='win'){
      [392,523,659,784,1047,1319].forEach((f,i)=>{
        const o=c.createOscillator(),g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.type='triangle';
        o.frequency.setValueAtTime(f,n+i*0.08);
        g.gain.setValueAtTime(0.09,n+i*0.08);
        g.gain.linearRampToValueAtTime(0.001,n+i*0.08+0.25);
        o.start(n+i*0.08);o.stop(n+i*0.08+0.25);
      });
    }
  }catch(e){}
}
function toggleSound(){
  soundOn=!soundOn;
  document.getElementById('snd-icon').className=soundOn?'fa-solid fa-volume-high':'fa-solid fa-volume-xmark';
}

// ========== TOASTS ==========
function toast(text,icon,color){
  const box=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast '+color;
  el.innerHTML=`<i class="fa-solid ${icon}"></i><span>${text}</span>`;
  box.appendChild(el);
  setTimeout(()=>{
    el.style.animation='toastOut 0.35s ease forwards';
    setTimeout(()=>el.remove(),350);
  },3000);
}

// ========== PERSISTENCE ==========
function save(){
  try{
    localStorage.setItem(STORAGE,JSON.stringify({
      players,active,played:[...played],specials,blocked,history,bonuses
    }));
  }catch(e){}
}
function load(){
  try{
    const raw=localStorage.getItem(STORAGE);
    if(!raw){specials=genSpecials();return;}
    const d=JSON.parse(raw);
    if(d.players)players=d.players;
    if(typeof d.active==='number')active=d.active;
    if(d.played)played=new Set(d.played);
    if(d.specials&&Object.keys(d.specials).length)specials=d.specials;
    else specials=genSpecials();
    if(d.blocked!==undefined)blocked=d.blocked;
    if(d.history)history=d.history;
    if(d.bonuses)bonuses=d.bonuses;
  }catch(e){specials=genSpecials();}
}

// ========== RENDER ==========
function render(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  cats.forEach(cat=>{
    const col=document.createElement('div');
    col.className='col';
    const doneCount=pts.filter(p=>played.has(`${cat.id}-${p}`)).length;
    const isDone=doneCount===pts.length;
    const h=document.createElement('div');
    h.className='cat-h'+(isDone?' done':'');
    h.style.background=cat.color;
    h.innerHTML=`<i class="fa-solid ${cat.icon}"></i><span>${cat.name}</span><span class="done-tick"><i class="fa-solid fa-check"></i></span>`;
    col.appendChild(h);
    const tiers=document.createElement('div');
    tiers.className='tiers';
    pts.forEach(p=>{
      const key=`${cat.id}-${p}`;
      const isPlayed=played.has(key);
      const cell=document.createElement('button');
      const isMega=specials[key]&&['jackpot','sniper','clover','circus'].includes(specials[key]);
      cell.className='cell'+(isPlayed?' done':'')+(isMega?' mega':'');
      cell.dataset.key=key;
      if(isPlayed){cell.innerHTML='<i class="fa-solid fa-check"></i>';}
      else{cell.textContent=p;}
      cell.onclick=()=>openQ(cell,key,cat,p);
      tiers.appendChild(cell);
    });
    col.appendChild(tiers);
    grid.appendChild(col);
  });
  updateHUD();
  renderHistoryBadge();
}

function updateHUD(){
  document.getElementById('score-0').textContent=players[0].score;
  document.getElementById('score-1').textContent=players[1].score;
  document.getElementById('pname-0').textContent=players[0].name;
  document.getElementById('pname-1').textContent=players[1].name;

  const pc0=document.getElementById('pc-0'),pc1=document.getElementById('pc-1');
  const pm0=document.getElementById('pmeta-0'),pm1=document.getElementById('pmeta-1');
  const s0=document.getElementById('streak-0'),s1=document.getElementById('streak-1');

  if(active===0){
    pc0.className='player card active-kira';
    pc1.className='player card inactive';
    pm0.className='p-meta kira-active';
    pm0.innerHTML='<span class="dot"></span><span>ходит сейчас</span>';
    pm1.className='p-meta';
    pm1.innerHTML='<span>ждёт хода</span>';
  }else{
    pc0.className='player card inactive';
    pc1.className='player card active-vitya';
    pm0.className='p-meta';
    pm0.innerHTML='<span>ждёт хода</span>';
    pm1.className='p-meta vitya-active';
    pm1.innerHTML='<span class="dot"></span><span>ходит сейчас</span>';
  }

  // Streak badges
  [0,1].forEach(i=>{
    const s=document.getElementById(`streak-${i}`);
    if(players[i].streak>=2){
      s.classList.remove('hidden');
      s.innerHTML=`<i class="fa-solid fa-fire"></i> ×${players[i].streak}`;
    }else{
      s.classList.add('hidden');
    }
  });

  // Frozen indicator
  [0,1].forEach(i=>{
    if(players[i].frozen>0){
      const pm=document.getElementById(`pmeta-${i}`);
      pm.innerHTML+=` <span style="color:#38BDF8;font-weight:900;">❄ ${players[i].frozen}</span>`;
    }
  });

  const total=cats.length*pts.length;
  const done=played.size;
  const pct=Math.round((done/total)*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('prog-label').textContent=`${done} / ${total}`;
}

function pulseScore(idx){
  const el=document.getElementById(`score-${idx}`);
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
}

function renderHistoryBadge(){
  const b=document.getElementById('hist-badge');
  if(history.length>0){b.textContent=history.length;b.classList.remove('hidden');}
  else b.classList.add('hidden');
}

// ========== OPEN QUESTION ==========
function openQ(cell,key,cat,points){
  if(played.has(key))return;
  sfx('click');
  curCell=cell;curKey=key;
  const sp=specials[key];
  const info=sp?specInfo(sp):null;

  // Instant cells
  if(sp==='bonus'||sp==='penalty'){
    const isBonus=sp==='bonus';
    const delta=isBonus?points:-points;
    players[active].score+=delta;
    pulseScore(active);
    if(isBonus)sfx('correct');else sfx('wrong');
    addHistory(active,cat,points,delta,sp);
    showInstant(isBonus,delta);
    played.add(key);
    cell.classList.add('done');
    cell.innerHTML='<i class="fa-solid fa-check"></i>';
    save();render();
    return;
  }

  if(sp==='casino'){
    // 50/50 random
    const win=Math.random()<0.5;
    const delta=win?points*2:-points*2;
    players[active].score+=delta;
    pulseScore(active);
    if(win)sfx('correct');else sfx('wrong');
    addHistory(active,cat,points,delta,sp);
    showInstant(win,delta,'casino');
    played.add(key);
    cell.classList.add('done');
    cell.innerHTML='<i class="fa-solid fa-check"></i>';
    save();render();
    return;
  }

  if(sp==='circus'){
    // Swap scores!
    const t=players[0].score;
    players[0].score=players[1].score;
    players[1].score=t;
    pulseScore(0);pulseScore(1);
    sfx('correct');
    addHistory(active,cat,points,0,'circus');
    showInstant(true,0,'circus');
    played.add(key);
    cell.classList.add('done');
    cell.innerHTML='<i class="fa-solid fa-check"></i>';
    save();render();
    return;
  }

  cur={key,cat,points,data:db[cat.id][points],special:sp};

  document.getElementById('m-cat').textContent=cat.name;
  document.getElementById('m-cat').style.background=cat.color;
  document.getElementById('m-points').textContent=points+' pts';
  const d=diffOf(points);
  document.getElementById('m-diff').innerHTML=`<i class="fa-solid ${d.i}"></i> ${d.l}`;
  document.getElementById('m-turn').textContent=players[active].name;
  document.getElementById('m-q').textContent=cur.data.q;
  document.getElementById('m-ans-t').textContent=cur.data.a;

  const sb=document.getElementById('m-spec');
  if(info){
    sb.classList.remove('hidden');
    sb.style.background=info.bg;
    sb.innerHTML=`<i class="fa-solid ${info.icon}"></i> ${info.label}`;
  }else sb.classList.add('hidden');

  const warn=document.getElementById('m-warn');
  warn.className='warn';
  if(sp==='double'){
    warn.style.background='linear-gradient(135deg,rgba(78,205,196,0.18),rgba(78,205,196,0.05))';
    warn.style.borderColor='rgba(78,205,196,0.4)';
    warn.innerHTML=`<div class="warn-t" style="color:var(--mint)"><i class="fa-solid fa-gem"></i>×2 УДВОЕНИЕ</div><div class="warn-x">Верно → <strong>+${points*2}</strong><br>Ошибка → <strong>-${points}</strong></div>`;
  }else if(sp==='trap'){
    warn.style.background='linear-gradient(135deg,rgba(255,107,107,0.18),rgba(255,107,107,0.05))';
    warn.style.borderColor='rgba(255,107,107,0.4)';
    warn.innerHTML=`<div class="warn-t" style="color:var(--coral)"><i class="fa-solid fa-triangle-exclamation"></i>ЛОВУШКА</div><div class="warn-x">Верно → <strong>+${points}</strong><br>Ошибка → <strong>-${points*2}</strong></div>`;
  }else if(sp==='jackpot'){
    warn.style.background='linear-gradient(135deg,rgba(155,126,222,0.2),rgba(155,126,222,0.06))';
    warn.style.borderColor='rgba(155,126,222,0.5)';
    warn.innerHTML=`<div class="warn-t" style="color:var(--lavender)"><i class="fa-solid fa-gift"></i>ДЖЕКПОТ ×5</div><div class="warn-x">Верно → <strong>+${points*5}</strong>!!!<br>Ошибка → <strong>-${points}</strong></div>`;
  }else if(sp==='block'){
    warn.style.background='linear-gradient(135deg,rgba(107,86,74,0.2),rgba(107,86,74,0.06))';
    warn.style.borderColor='rgba(107,86,74,0.4)';
    warn.innerHTML=`<div class="warn-t" style="color:var(--ink-soft)"><i class="fa-solid fa-ban"></i>БЛОКИРОВКА</div><div class="warn-x">Соперник пропустит следующий ход</div>`;
  }else if(sp==='mine'){
    warn.style.background='linear-gradient(135deg,rgba(74,58,46,0.2),rgba(74,58,46,0.06))';
    warn.style.borderColor='rgba(74,58,46,0.4)';
    warn.innerHTML=`<div class="warn-t" style="color:var(--ink-soft)"><i class="fa-solid fa-bomb"></i>МИНА</div><div class="warn-x">Ответишь неверно — штраф <strong>×2</strong></div>`;
  }else if(sp==='sniper'){
    warn.style.background='linear-gradient(135deg,rgba(74,159,245,0.2),rgba(74,159,245,0.06))';
    warn.style.borderColor='rgba(74,159,245,0.4)';
    warn.innerHTML=`<div class="warn-t" style="color:var(--sky)"><i class="fa-solid fa-crosshairs"></i>ТОЧНЫЙ УДАР</div><div class="warn-x">Верный ответ принесёт <strong>×3</strong>!</div>`;
  }else if(sp==='freeze'){
    warn.style.background='linear-gradient(135deg,rgba(125,211,252,0.2),rgba(125,211,252,0.06))';
    warn.style.borderColor='rgba(125,211,252,0.5)';
    warn.innerHTML=`<div class="warn-t" style="color:#38BDF8"><i class="fa-solid fa-snowflake"></i>ЗАМОРОЗКА</div><div class="warn-x">Соперник пропустит <strong>2 хода</strong></div>`;
  }else if(sp==='clover'){
    warn.style.background='linear-gradient(135deg,rgba(74,222,128,0.2),rgba(74,222,128,0.06))';
    warn.style.borderColor='rgba(74,222,128,0.4)';
    warn.innerHTML=`<div class="warn-t" style="color:var(--sage)"><i class="fa-solid fa-clover"></i>КЛЕВЕР</div><div class="warn-x">Заберёшь <strong>50%</strong> очков соперника!</div>`;
  }else{
    warn.classList.add('hidden');
  }

  updateScoreLabels();
  document.getElementById('m-ans').classList.add('hidden');
  document.getElementById('reveal-wrap').classList.remove('hidden');
  document.getElementById('q-ov').classList.remove('hidden');
  updateSBlocks();
}

function updateScoreLabels(){
  const p=cur.points,s=cur.special;
  let plus=p,minus=p;
  if(s==='double'){plus=p*2;minus=p;}
  else if(s==='trap'){plus=p;minus=p*2;}
  else if(s==='jackpot'){plus=p*5;minus=p;}
  else if(s==='sniper'){plus=p*3;minus=p;}
  else if(s==='mine'){plus=p;minus=p*2;}

  // Apply player bonuses
  if(bonuses.p0.next==='sniper')plus=p*3;
  if(bonuses.p1.next==='sniper')plus=p*3;

  document.getElementById('kp').textContent='+'+plus;
  document.getElementById('km').textContent='-'+minus;
  document.getElementById('vp').textContent='+'+plus;
  document.getElementById('vm').textContent='-'+minus;
  document.getElementById('sb-n0').textContent=players[0].name;
  document.getElementById('sb-n1').textContent=players[1].name;
}

function updateSBlocks(){
  for(let i=0;i<2;i++){
    const b=document.getElementById('sb-'+i),t=document.getElementById('tag-'+i);
    if(i===active){b.classList.remove('locked');b.classList.add('active');t.classList.remove('hidden');}
    else{b.classList.add('locked');b.classList.remove('active');t.classList.add('hidden');}
  }
}

function revealAnswer(){
  sfx('click');
  document.getElementById('m-ans').classList.remove('hidden');
  document.getElementById('reveal-wrap').classList.add('hidden');
}

// ========== SCORING ==========
function score(idx,correct){
  if(!cur)return;
  if(idx!==active){sfx('wrong');return;}
  const p=cur.points,s=cur.special;

  if(s==='block'){
    blocked=active===0?1:0;
    sfx('correct');
    toast(`${players[active].name} блокирует соперника!`,'fa-ban','blue');
    addHistory(active,cur.cat,p,0,'block');
    finishTurn(false);
    return;
  }

  if(s==='freeze'){
    const opp=active===0?1:0;
    players[opp].frozen=2;
    sfx('correct');
    toast(`${players[opp].name} заморожен на 2 хода!`,'fa-snowflake','blue');
    addHistory(active,cur.cat,p,0,'freeze');
    finishTurn(false);
    return;
  }

  if(s==='clover'){
    const opp=active===0?1:0;
    const steal=Math.floor(players[opp].score/2);
    players[opp].score-=steal;
    players[active].score+=steal;
    pulseScore(0);pulseScore(1);
    sfx('correct');
    toast(`Украдено ${steal} очков!`,'fa-clover','green');
    addHistory(active,cur.cat,p,steal,'clover');
    finishTurn(false);
    return;
  }

  let delta;
  if(s==='double')delta=correct?p*2:-p;
  else if(s==='trap')delta=correct?p:-p*2;
  else if(s==='jackpot')delta=correct?p*5:-p;
  else if(s==='sniper')delta=correct?p*3:-p;
  else if(s==='mine')delta=correct?p:-p*2;
  else delta=correct?p:-p;

  // Apply active bonuses
  if(correct&&bonuses['p'+active].next==='sniper')delta*=3;
  if(!correct&&bonuses['p'+active].next==='mine')delta*=2;

  // Streak bonus
  if(correct){
    players[idx].streak=(players[idx].streak||0)+1;
    if(players[idx].streak>=3){
      delta=Math.round(delta*1.5);
      toast(`Стрик ×${players[idx].streak}! Бонус ×1.5`,'fa-fire','gold');
    }
    // Reset consumed bonuses
    if(bonuses['p'+active].next==='sniper')bonuses['p'+active].next=null;
    // Apply mine as persistent effect
    if(s==='mine'){bonuses['p'+active].next='mine';toast(`Установлена мина на след. ошибку!`,'fa-bomb','pink');}
  }else{
    if(bonuses['p'+active].next==='mine')bonuses['p'+active].next=null;
    players[idx].streak=0;
    // Screen shake
    document.body.classList.add('shake');
    setTimeout(()=>document.body.classList.remove('shake'),500);
  }

  if(!correct&&Math.abs(delta)>=400){
    if(!confirm(`Списать ${Math.abs(delta)} очков у ${players[idx].name}?`))return;
  }

  if(correct)sfx('correct');else sfx('wrong');
  players[idx].score+=delta;
  pulseScore(idx);
  addHistory(idx,cur.cat,p,delta,s);

  finishTurn(!correct);
}

function addHistory(idx,cat,points,delta,spec){
  history.push({idx,cat:cat.name,color:cat.color,points,delta,spec,time:Date.now()});
  if(history.length>30)history.shift();
  save();
  renderHistoryBadge();
}

function finishTurn(switchTurn){
  if(curKey)played.add(curKey);
  if(curCell){curCell.classList.add('done');curCell.innerHTML='<i class="fa-solid fa-check"></i>';}

  if(switchTurn){
    let next=active===0?1:0;
    if(blocked!==null&&next===blocked){blocked=null;next=next===0?1:0;}
    if(players[next].frozen>0){
      players[next].frozen--;
      toast(`${players[next].name} пропускает ход (заморозка)`,'fa-snowflake','blue');
      next=next===0?1:0;
    }
    active=next;
  }

  save();render();closeQ(true);
  checkAchievements();
}

function closeQ(skip){
  if(curKey&&!skip){
    played.add(curKey);
    if(curCell){curCell.classList.add('done');curCell.innerHTML='<i class="fa-solid fa-check"></i>';}
    let next=active===0?1:0;
    if(blocked!==null&&next===blocked){blocked=null;next=next===0?1:0;}
    if(players[next].frozen>0){players[next].frozen--;next=next===0?1:0;}
    active=next;
    save();render();
  }
  document.getElementById('q-ov').classList.add('hidden');
  cur=null;curCell=null;curKey=null;
  checkDone();
}

// ========== INSTANT ==========
function showInstant(isWin,delta,kind){
  const icon=document.getElementById('i-icon');
  const title=document.getElementById('i-title');
  const desc=document.getElementById('i-desc');

  if(kind==='casino'){
    if(isWin){
      icon.style.background='linear-gradient(135deg,var(--mustard),#F59E0B)';
      icon.innerHTML='<i class="fa-solid fa-trophy"></i>';
      title.textContent='Казино! Победа!';
      desc.textContent=`${players[active].name} получает +${delta} очков!`;
    }else{
      icon.style.background='linear-gradient(135deg,var(--coral),#DC2626)';
      icon.innerHTML='<i class="fa-solid fa-face-dizzy"></i>';
      title.textContent='Казино! Проигрыш!';
      desc.textContent=`${players[active].name} теряет ${Math.abs(delta)} очков!`;
    }
  }else if(kind==='circus'){
    icon.style.background='linear-gradient(135deg,#FF85C1,#F472B6)';
    icon.innerHTML='<i class="fa-solid fa-hat-wizard"></i>';
    title.textContent='Цирк!';
    desc.textContent='Игроки обменялись очками!';
  }else if(isWin){
    icon.style.background='linear-gradient(135deg,var(--sage),#5A9344)';
    icon.innerHTML='<i class="fa-solid fa-dice"></i>';
    title.textContent='Бонус!';
    desc.textContent=`${players[active].name} получает +${delta} очков!`;
  }else{
    icon.style.background='linear-gradient(135deg,var(--terracotta),#D05A3E)';
    icon.innerHTML='<i class="fa-solid fa-burst"></i>';
    title.textContent='Штраф!';
    desc.textContent=`${players[active].name} теряет ${Math.abs(delta)} очков!`;
  }
  document.getElementById('i-ov').classList.remove('hidden');
  if(isWin&&delta>0){
    confetti({particleCount:40,spread:70,origin:{y:0.6},colors:['#E9B44C','#7FB069','#4ECDC4']});
  }
}

function closeInstant(){
  document.getElementById('i-ov').classList.add('hidden');
  let next=active===0?1:0;
  if(blocked!==null&&next===blocked){blocked=null;next=next===0?1:0;}
  if(players[next].frozen>0){players[next].frozen--;next=next===0?1:0;}
  active=next;
  save();render();
  checkDone();
  checkAchievements();
}

// ========== ACHIEVEMENTS ==========
const achDone=new Set();
function checkAchievements(){
  const total=players[0].score+players[1].score;
  if(!achDone.has('first')&&played.size>=1){
    achDone.add('first');toast('Первая ячейка открыта!','fa-star','gold');
  }
  if(!achDone.has('half')&&played.size>=60){
    achDone.add('half');toast('Половина игры пройдена!','fa-flag-checkered','blue');
  }
  [0,1].forEach(i=>{
    if(!achDone.has('streak3-'+i)&&players[i].streak>=3){
      achDone.add('streak3-'+i);toast(`${players[i].name}: стрик ×3!`,'fa-fire','gold');
    }
    if(!achDone.has('big-'+i)&&players[i].score>=2000){
      achDone.add('big-'+i);toast(`${players[i].name} набрал 2000!`,'fa-crown','gold');
    }
  });
}

// ========== RANDOM ==========
function openRandom(){
  const remaining=[];
  cats.forEach(c=>pts.forEach(p=>{
    const k=`${c.id}-${p}`;
    if(!played.has(k))remaining.push({cat:c,p,k});
  }));
  if(!remaining.length)return;
  const pick=remaining[Math.floor(Math.random()*remaining.length)];
  document.querySelectorAll('.cell').forEach(cell=>{
    if(cell.dataset.key===pick.k&&!cell.classList.contains('done'))cell.click();
  });
}

// ========== HISTORY ==========
function openHistory(){
  const list=document.getElementById('hist-list');
  if(history.length===0){
    list.innerHTML='<div class="hist-empty">Пока нет ходов</div>';
  }else{
    list.innerHTML=history.slice().reverse().map((h,i)=>{
      const sign=h.delta>0?'+':(h.delta<0?'':''),
      cls=h.delta>0?'pos':(h.delta<0?'neg':'');
      const iconCls=h.idx===0?'linear-gradient(135deg,var(--coral),var(--terracotta))':'linear-gradient(135deg,var(--sky),var(--lavender))';
      const valTxt=h.delta!==0?`${sign}${h.delta}`:'—';
      return `<div class="hist-item">
        <div class="ic" style="background:${iconCls}">${h.idx===0?'К':'В'}</div>
        <div class="inf">
          <div class="nm">${h.cat} · ${h.points}pts</div>
          <div class="dt">${new Date(h.time).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</div>
        </div>
        <div class="vl ${cls}">${valTxt}</div>
      </div>`;
    }).join('');
  }
  const undoBtn=document.getElementById('undo-btn');
  if(history.length>0)undoBtn.style.display='flex';
  else undoBtn.style.display='none';
  document.getElementById('h-ov').classList.remove('hidden');
}

function undoLast(){
  if(history.length===0)return;
  const last=history[history.length-1];
  players[last.idx].score-=last.delta;
  // Free the cell
  const cat=cats.find(c=>c.name===last.cat);
  if(cat){
    const key=`${cat.id}-${last.points}`;
    played.delete(key);
    // Clear from grid
    document.querySelectorAll('.cell').forEach(c=>{
      if(c.dataset.key===key){c.classList.remove('done');c.textContent=last.points;}
    });
  }
  history.pop();
  active=last.idx;
  save();render();
  openHistory(); // refresh
  toast('Ход отменён','fa-undo','blue');
}

// ========== RENAME ==========
function renamePlayer(idx){
  const current=players[idx].name;
  const name=prompt('Новое имя:',current);
  if(name&&name.trim()){
    players[idx].name=name.trim().slice(0,20);
    save();render();
    toast(`${players[idx].name} в игре!`,'fa-pen','blue');
  }
}

// ========== WIN ==========
function checkDone(){
  const total=cats.length*pts.length;
  if(played.size>=total)setTimeout(()=>showWinner(),500);
}

function showWinner(){
  sfx('win');
  const n0=players[0].name,n1=players[1].name;
  document.getElementById('fw-0').textContent=n0.toUpperCase();
  document.getElementById('fw-1').textContent=n1.toUpperCase();
  document.getElementById('w-0').textContent=players[0].score;
  document.getElementById('w-1').textContent=players[1].score;
  let name='';
  if(players[0].score>players[1].score)name=`${n0} побеждает!`;
  else if(players[1].score>players[0].score)name=`${n1} побеждает!`;
  else name='Ничья!';
  document.getElementById('w-name').textContent=name;
  document.getElementById('w-ov').classList.remove('hidden');
  if(window.confetti){
    const end=Date.now()+3500;
    (function frame(){
      confetti({particleCount:8,angle:60,spread:60,origin:{x:0},colors:['#FF6B6B','#E9B44C','#7FB069','#9B7EDE']});
      confetti({particleCount:8,angle:120,spread:60,origin:{x:1},colors:['#FF6B6B','#E9B44C','#7FB069','#9B7EDE']});
      if(Date.now()<end)requestAnimationFrame(frame);
    })();
  }
}

function closeModal(id){document.getElementById(id).classList.add('hidden');}

// ========== RESET ==========
function resetGame(force){
  if(!force&&played.size>0&&!confirm('Сбросить игру? Очки и ячейки обнулятся!'))return;
  sfx('click');
  players=[{name:players[0].name,score:0,streak:0,frozen:0},{name:players[1].name,score:0,streak:0,frozen:0}];
  active=0;blocked=null;played.clear();specials=genSpecials();
  history=[];bonuses={p0:{next:null},p1:{next:null}};achDone.clear();
  localStorage.removeItem(STORAGE);
  save();render();
}

// ========== INIT ==========
window.addEventListener('DOMContentLoaded',()=>{load();render();});
</script>

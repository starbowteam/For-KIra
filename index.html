<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>СВОЯ ИГРА • PREMIUM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --bg-0: #080B14;
  --bg-1: #0E1320;
  --bg-2: #141A2B;
  --surface: rgba(255, 255, 255, 0.04);
  --surface-hi: rgba(255, 255, 255, 0.07);
  --border: rgba(255, 255, 255, 0.09);
  --border-hi: rgba(255, 255, 255, 0.16);
  --text: #E8EDF7;
  --text-dim: #8992AB;
  --text-faint: #5A6478;
  --pink: #FF5C9D;
  --violet: #A78BFA;
  --cyan: #22D3EE;
  --amber: #FBBF24;
  --emerald: #34D399;
  --red: #F87171;
  --blue: #60A5FA;
  --orange: #FB923C;
  --green: #4ADE80;
}
* { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg-0);
  background-image:
    radial-gradient(ellipse 60% 40% at 15% 0%, rgba(167, 139, 250, 0.15), transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 5%, rgba(255, 92, 157, 0.12), transparent 60%),
    radial-gradient(ellipse 70% 50% at 50% 100%, rgba(34, 211, 238, 0.10), transparent 60%);
  background-attachment: fixed;
  color: var(--text);
  font-family: 'Manrope', system-ui, sans-serif;
  height: 100vh;
  height: 100dvh;
  height: -webkit-fill-available;
  overflow: hidden;
  padding: max(10px, var(--sat)) max(10px, var(--sar)) max(10px, var(--sab)) max(10px, var(--sal));
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  gap: 10px;
  font-weight: 500;
}
.heading { font-family: 'Unbounded', sans-serif; font-weight: 700; letter-spacing: -0.02em; }

.glass {
  background: var(--surface);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid var(--border);
  border-radius: 18px;
  box-shadow: 
    0 1px 0 rgba(255, 255, 255, 0.04) inset,
    0 10px 40px -10px rgba(0, 0, 0, 0.5);
}
.glass-hi {
  background: var(--surface-hi);
  backdrop-filter: blur(20px) saturate(1.5);
  -webkit-backdrop-filter: blur(20px) saturate(1.5);
  border: 1px solid var(--border-hi);
  border-radius: 18px;
}

/* HEADER */
header {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px;
}
.brand {
  display: flex; align-items: center; gap: 12px;
  min-width: 0;
}
.brand-logo {
  width: 42px; height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--violet), var(--pink));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  color: white;
  box-shadow: 0 8px 24px -6px rgba(167, 139, 250, 0.6);
  flex-shrink: 0;
}
.brand-text { min-width: 0; }
.brand-title {
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: -0.02em;
  color: var(--text);
  line-height: 1.1;
}
.brand-sub {
  font-size: 10px;
  color: var(--text-dim);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 3px;
}
.header-actions {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}

.icon-btn {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-dim);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 15px;
}
.icon-btn:hover {
  background: var(--surface-hi);
  color: var(--text);
  border-color: var(--border-hi);
  transform: translateY(-1px);
}
.icon-btn:active { transform: translateY(0) scale(0.96); }

.pill-btn {
  height: 40px;
  padding: 0 16px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.pill-btn:hover {
  background: var(--surface-hi);
  border-color: var(--border-hi);
  transform: translateY(-1px);
}
.pill-btn:active { transform: translateY(0) scale(0.97); }
.pill-btn.accent {
  background: linear-gradient(135deg, var(--violet), var(--pink));
  border-color: transparent;
  color: white;
  box-shadow: 0 8px 24px -8px rgba(167, 139, 250, 0.6);
}
.pill-btn.accent:hover { box-shadow: 0 12px 32px -8px rgba(167, 139, 250, 0.8); }

/* PLAYERS ROW */
.players {
  flex-shrink: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.player {
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
}
.player::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.03));
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}
.player.active::before { opacity: 1; }
.player.active-kira {
  border-color: rgba(255, 92, 157, 0.5);
  box-shadow: 0 0 0 1px rgba(255, 92, 157, 0.3), 0 12px 40px -10px rgba(255, 92, 157, 0.4);
}
.player.active-vitya {
  border-color: rgba(34, 211, 238, 0.5);
  box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.3), 0 12px 40px -10px rgba(34, 211, 238, 0.4);
}
.player.inactive { opacity: 0.5; }

.p-avatar {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  color: white;
  flex-shrink: 0;
}
.p-avatar.kira { background: linear-gradient(135deg, #FF5C9D, #F43F5E); }
.p-avatar.vitya { background: linear-gradient(135deg, #22D3EE, #3B82F6); }
.p-info { min-width: 0; flex: 1; }
.p-name {
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: 13px;
  color: var(--text);
  line-height: 1.2;
}
.p-status {
  font-size: 10px;
  color: var(--text-dim);
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-top: 3px;
  display: flex; align-items: center; gap: 5px;
}
.p-status.active-kira { color: var(--pink); }
.p-status.active-vitya { color: var(--cyan); }
.p-status .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 8px currentColor;
  animation: pulseDot 1.5s ease-in-out infinite;
}
@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.7); }
}
.p-score {
  text-align: right;
  flex-shrink: 0;
}
.p-score-val {
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: 26px;
  line-height: 1;
  transition: transform 0.3s ease;
}
.p-score-val.kira { color: var(--pink); text-shadow: 0 0 20px rgba(255, 92, 157, 0.4); }
.p-score-val.vitya { color: var(--cyan); text-shadow: 0 0 20px rgba(34, 211, 238, 0.4); }
.p-score-val.pulse { animation: scorePulse 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes scorePulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}
.p-score-lbl {
  font-size: 9px;
  color: var(--text-faint);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-top: 3px;
}

/* PROGRESS BAR */
.progress-wrap {
  flex-shrink: 0;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-info {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 700;
  letter-spacing: 0.05em;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 6px;
}
.progress-info i { font-size: 12px; color: var(--violet); }
.progress-track {
  flex: 1;
  height: 6px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--violet), var(--pink), var(--cyan));
  border-radius: 3px;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 12px rgba(167, 139, 250, 0.5);
}
.progress-pct {
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: 12px;
  color: var(--violet);
  flex-shrink: 0;
  min-width: 40px;
  text-align: right;
}

/* GRID */
main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.grid-container {
  flex: 1;
  min-height: 0;
  padding: 12px;
  overflow: hidden;
  display: flex;
}
#grid {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  overflow-y: auto;
  align-content: start;
}
#grid::-webkit-scrollbar { width: 6px; }
#grid::-webkit-scrollbar-thumb { background: rgba(167, 139, 250, 0.3); border-radius: 3px; }
#grid::-webkit-scrollbar-track { background: transparent; }

.cat-col {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 0;
}
.cat-header {
  padding: 8px 6px;
  border-radius: 10px;
  text-align: center;
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: 9px;
  letter-spacing: -0.01em;
  color: white;
  line-height: 1.2;
  text-transform: uppercase;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  transition: all 0.3s ease;
}
.cat-header .done-badge {
  display: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  color: #0A0A0A;
  align-items: center;
  justify-content: center;
  font-size: 9px;
}
.cat-header.done .done-badge { display: inline-flex; }
.cat-header::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent);
  pointer-events: none;
}

.tiers {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-height: 0;
  overflow-y: auto;
}

.cell {
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: 13px;
  min-height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}
.cell::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(167, 139, 250, 0.2), transparent 70%);
  opacity: 0;
  transition: opacity 0.2s ease;
  pointer-events: none;
}
.cell:hover:not(.done) {
  background: var(--surface-hi);
  border-color: rgba(167, 139, 250, 0.5);
  color: white;
  transform: translateY(-2px);
  box-shadow: 0 8px 20px -6px rgba(167, 139, 250, 0.5);
}
.cell:hover:not(.done)::before { opacity: 1; }
.cell:active:not(.done) { transform: translateY(0) scale(0.96); }
.cell.done {
  background: rgba(52, 211, 153, 0.08);
  border-color: rgba(52, 211, 153, 0.2);
  color: rgba(52, 211, 153, 0.4);
  cursor: not-allowed;
}
.cell.done i { font-size: 14px; }

/* DESKTOP HORIZONTAL */
@media (min-width: 1024px) {
  #grid {
    display: flex !important;
    flex-direction: column;
    gap: 7px;
    overflow: hidden;
  }
  .cat-col {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 130px repeat(10, 1fr);
    gap: 7px;
  }
  .cat-header {
    height: 100%;
    font-size: 9px;
    padding: 4px;
    line-height: 1.2;
    flex-direction: column;
    gap: 4px;
  }
  .tiers { display: contents; }
  .cell { min-height: 0; height: 100%; font-size: 15px; }
}
@media (min-width: 640px) and (max-width: 1023px) {
  #grid { grid-template-columns: repeat(3, 1fr); }
}
@media (min-width: 768px) and (max-width: 1023px) {
  #grid { grid-template-columns: repeat(4, 1fr); }
}

/* FOOTER */
footer {
  flex-shrink: 0;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.legend {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 10px;
  color: var(--text-dim);
  font-weight: 600;
}
.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.legend-item i { font-size: 11px; }
.legend-item.gem i { color: var(--cyan); }
.legend-item.trap i { color: var(--red); }
.legend-item.jackpot i { color: var(--violet); }
.legend-item.bonus i { color: var(--emerald); }
.legend-item.penalty i { color: var(--orange); }
.legend-item.block i { color: var(--text-faint); }

/* MODAL */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(3, 5, 12, 0.8);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.sheet {
  background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 100%);
  border: 1px solid var(--border);
  border-bottom: none;
  border-radius: 24px 24px 0 0;
  width: 100%;
  max-width: 620px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-height: 92vh;
  overflow-y: auto;
  box-shadow: 0 -20px 60px -20px rgba(0, 0, 0, 0.8);
  animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.sheet-handle {
  width: 48px; height: 4px;
  background: var(--border-hi);
  border-radius: 2px;
  margin: 0 auto -6px;
}
.sheet-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.badges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: 8px;
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
}
.badge.cat { border-color: transparent; color: white; }
.badge.points { background: linear-gradient(135deg, var(--amber), var(--orange)); color: #0A0A0A; border-color: transparent; font-family: 'Unbounded', sans-serif; }
.badge.special { border-color: transparent; color: white; }

.turn-info {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.turn-info strong { color: var(--text); font-weight: 800; }

.sheet-body {
  text-align: center;
  padding: 8px 0;
}
.diff-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  color: var(--text-dim);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 12px;
}
.diff-badge i { color: var(--violet); }

.question-text {
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 20px;
  line-height: 1.35;
  color: var(--text);
  margin: 4px 0 12px;
  letter-spacing: -0.01em;
}
@media (min-width: 640px) {
  .question-text { font-size: 22px; }
}

.answer-box {
  background: linear-gradient(135deg, rgba(52, 211, 153, 0.15), rgba(52, 211, 153, 0.05));
  border: 1px solid rgba(52, 211, 153, 0.3);
  border-radius: 14px;
  padding: 14px;
  text-align: left;
  margin-top: 12px;
  animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes popIn {
  0% { transform: scale(0.9); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.answer-label {
  font-size: 10px;
  color: var(--emerald);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.answer-text {
  font-family: 'Manrope', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: white;
  line-height: 1.4;
}

.warn-box {
  border-radius: 14px;
  padding: 12px;
  text-align: center;
  margin-top: 12px;
  border: 1px solid transparent;
}
.warn-title {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.warn-text {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.4;
}

.reveal-btn {
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--violet), var(--pink));
  color: white;
  border: none;
  font-family: 'Unbounded', sans-serif;
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 8px 24px -8px rgba(167, 139, 250, 0.6);
  transition: all 0.2s ease;
}
.reveal-btn:hover {
  box-shadow: 0 12px 32px -8px rgba(167, 139, 250, 0.9);
  transform: translateY(-1px);
}
.reveal-btn:active { transform: translateY(0) scale(0.98); }

.score-blocks {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.sblock {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: all 0.3s ease;
}
.sblock.kira.active {
  background: linear-gradient(135deg, rgba(255, 92, 157, 0.15), rgba(255, 92, 157, 0.05));
  border-color: rgba(255, 92, 157, 0.4);
  box-shadow: 0 0 0 1px rgba(255, 92, 157, 0.2), 0 8px 24px -8px rgba(255, 92, 157, 0.4);
}
.sblock.vitya.active {
  background: linear-gradient(135deg, rgba(34, 211, 238, 0.15), rgba(34, 211, 238, 0.05));
  border-color: rgba(34, 211, 238, 0.4);
  box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.2), 0 8px 24px -8px rgba(34, 211, 238, 0.4);
}
.sblock.locked { opacity: 0.35; pointer-events: none; }

.sblock-title {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.sblock-title.kira { color: var(--pink); }
.sblock-title.vitya { color: var(--cyan); }

    { t: 'block', n: 3 },

  });
  return map;
}

// ============= AUDIO =============
let audioCtx = null;
function ac() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function sfx(type) {
  if (muted) return;
  try {
    const ctx = ac(), now = ctx.currentTime;
    if (type === 'click') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.setValueAtTime(600, now);
      o.frequency.exponentialRampToValueAtTime(900, now + 0.04);
      g.gain.setValueAtTime(0.05, now);
      g.gain.linearRampToValueAtTime(0.001, now + 0.05);
      o.start(now); o.stop(now + 0.05);
    } else if (type === 'correct') {
      [523, 659, 784, 1047].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(f, now + i * 0.06);
        g.gain.setValueAtTime(0.08, now + i * 0.06);
        g.gain.linearRampToValueAtTime(0.001, now + i * 0.06 + 0.15);
        o.start(now + i * 0.06); o.stop(now + i * 0.06 + 0.15);
      });
    } else if (type === 'wrong') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(220, now);
      o.frequency.linearRampToValueAtTime(80, now + 0.2);
      g.gain.setValueAtTime(0.08, now);
      g.gain.linearRampToValueAtTime(0.001, now + 0.2);
      o.start(now); o.stop(now + 0.2);
    } else if (type === 'win') {
      [392, 523, 659, 784, 1047].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'triangle';
        o.frequency.setValueAtTime(f, now + i * 0.08);
        g.gain.setValueAtTime(0.09, now + i * 0.08);
        g.gain.linearRampToValueAtTime(0.001, now + i * 0.08 + 0.25);
        o.start(now + i * 0.08); o.stop(now + i * 0.08 + 0.25);
      });
    }
  } catch(e) {}
}
function toggleAudio() {
  muted = !muted;
  document.getElementById('audio-icon').className = muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
}

// ============= PERSISTENCE =============
function save() {
  try {
    localStorage.setItem(STORAGE, JSON.stringify({
      players, active, played: [...played], specials, blocked
    }));
  } catch(e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE);
    if (!raw) { specials = genSpecials(); return; }
    const d = JSON.parse(raw);
    if (d.players) players = d.players.map(p => ({...p, streak: p.streak || 0}));
    if (typeof d.active === 'number') active = d.active;
    if (d.played) played = new Set(d.played);
    if (d.specials && Object.keys(d.specials).length) specials = d.specials;
    else specials = genSpecials();
    if (d.blocked !== undefined) blocked = d.blocked;
  } catch(e) { specials = genSpecials(); }
}

// ============= RENDER =============
function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  cats.forEach(cat => {
    const col = document.createElement('div');
    col.className = 'cat-col';

    const doneCount = pts.filter(p => played.has(`${cat.id}-${p}`)).length;
    const isDone = doneCount === pts.length;

    const header = document.createElement('div');
    header.className = 'cat-header' + (isDone ? ' done' : '');
    header.style.background = cat.color;
    header.innerHTML = `<i class="fa-solid ${cat.icon}"></i><span>${cat.name}</span><span class="done-badge"><i class="fa-solid fa-check"></i></span>`;
    col.appendChild(header);

    const tiers = document.createElement('div');
    tiers.className = 'tiers';
    pts.forEach(p => {
      const key = `${cat.id}-${p}`;
      const isPlayed = played.has(key);
      const cell = document.createElement('button');
      cell.className = 'cell' + (isPlayed ? ' done' : '');
      if (isPlayed) {
        cell.innerHTML = '<i class="fa-solid fa-check"></i>';
      } else {
        cell.textContent = p;
      }
      cell.onclick = () => openQ(cell, key, cat, p);
      tiers.appendChild(cell);
    });
    col.appendChild(tiers);
    grid.appendChild(col);
  });
  updateHUD();
}

function updateHUD() {
  document.getElementById('score-0').textContent = players[0].score;
  document.getElementById('score-1').textContent = players[1].score;

  const p0 = document.getElementById('p-card-0');
  const p1 = document.getElementById('p-card-1');
  const s0 = document.getElementById('p-status-0');
  const s1 = document.getElementById('p-status-1');

  if (active === 0) {
    p0.className = 'player glass active active-kira';
    p1.className = 'player glass inactive';
    s0.innerHTML = '<span class="dot"></span><span>ходит сейчас</span>';
    s1.innerHTML = '<span>ждёт хода</span>';
    s0.className = 'p-status active-kira';
    s1.className = 'p-status';
  } else {
    p0.className = 'player glass inactive';
    p1.className = 'player glass active active-vitya';
    s0.innerHTML = '<span>ждёт хода</span>';
    s1.innerHTML = '<span class="dot"></span><span>ходит сейчас</span>';
    s0.className = 'p-status';
    s1.className = 'p-status active-vitya';
  }

  const total = cats.length * pts.length;
  const done = played.size;
  const pct = Math.round((done / total) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-label').textContent = `${done} / ${total}`;
}

function pulseScore(idx) {
  const el = document.getElementById(`score-${idx}`);
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
}

// ============= OPEN QUESTION =============
function openQ(cell, key, cat, points) {
  if (played.has(key)) return;
  sfx('click');
  curCell = cell;
  curKey = key;

  const special = specials[key];
  const info = special ? specInfo(special) : null;

  // INSTANT CELLS
  if (special === 'bonus' || special === 'penalty') {
    const isBonus = special === 'bonus';
    const delta = isBonus ? points : -points;
    players[active].score += delta;
    pulseScore(active);
    if (isBonus) sfx('correct'); else sfx('wrong');
    showInstant(isBonus, delta);
    played.add(key);
    cell.classList.add('done');
    cell.innerHTML = '<i class="fa-solid fa-check"></i>';
    save();
    render();
    return;
  }

  cur = { key, cat, points, data: db[cat.id][points], special };

  document.getElementById('m-cat').textContent = cat.name;
  document.getElementById('m-cat').style.background = cat.color;
  document.getElementById('m-points').textContent = points + ' pts';
  const d = diff(points);
  document.getElementById('m-diff').innerHTML = `<i class="fa-solid ${d.icon}"></i> ${d.label}`;
  document.getElementById('m-turn').textContent = players[active].name;
  document.getElementById('m-question').textContent = cur.data.q;
  document.getElementById('m-answer').textContent = cur.data.a;

  const sb = document.getElementById('m-special');
  if (info) {
    sb.classList.remove('hidden');
    sb.style.background = info.bg;
    sb.innerHTML = `<i class="fa-solid ${info.icon}"></i> ${info.label}`;
  } else sb.classList.add('hidden');

  const warn = document.getElementById('m-warn');
  if (special === 'double') {
    warn.className = 'warn-box';
    warn.style.background = 'linear-gradient(135deg,rgba(34,211,238,0.15),rgba(34,211,238,0.05))';
    warn.style.borderColor = 'rgba(34,211,238,0.4)';
    warn.innerHTML = `<div class="warn-title" style="color:var(--cyan)"><i class="fa-solid fa-gem"></i>×2 УДВОЕНИЕ</div><div class="warn-text">Верно → <strong>+${points*2}</strong><br>Ошибка → <strong>-${points}</strong></div>`;
  } else if (special === 'trap') {
    warn.className = 'warn-box';
    warn.style.background = 'linear-gradient(135deg,rgba(248,113,113,0.15),rgba(248,113,113,0.05))';
    warn.style.borderColor = 'rgba(248,113,113,0.4)';
    warn.innerHTML = `<div class="warn-title" style="color:var(--red)"><i class="fa-solid fa-triangle-exclamation"></i>ЛОВУШКА</div><div class="warn-text">Верно → <strong>+${points}</strong><br>Ошибка → <strong>-${points*2}</strong></div>`;
  } else if (special === 'jackpot') {
    warn.className = 'warn-box';
    warn.style.background = 'linear-gradient(135deg,rgba(167,139,250,0.2),rgba(167,139,250,0.05))';
    warn.style.borderColor = 'rgba(167,139,250,0.5)';
    warn.innerHTML = `<div class="warn-title" style="color:var(--violet)"><i class="fa-solid fa-gift"></i>ДЖЕКПОТ ×5</div><div class="warn-text">Верно → <strong>+${points*5}</strong>!!!<br>Ошибка → <strong>-${points}</strong></div>`;
  } else if (special === 'block') {
    warn.className = 'warn-box';
    warn.style.background = 'linear-gradient(135deg,rgba(107,114,128,0.25),rgba(107,114,128,0.1))';
    warn.style.borderColor = 'rgba(107,114,128,0.5)';
    warn.innerHTML = `<div class="warn-title" style="color:#9CA3AF"><i class="fa-solid fa-ban"></i>БЛОКИРОВКА</div><div class="warn-text">Соперник пропустит следующий ход</div>`;
  } else {
    warn.className = 'warn-box hidden';
  }

  updateScoreLabels();
  document.getElementById('m-answer-box').classList.add('hidden');
  document.getElementById('reveal-wrap').classList.remove('hidden');
  document.getElementById('q-overlay').classList.remove('hidden');
  updateSBlocks();
}

function updateScoreLabels() {
  const p = cur.points, s = cur.special;
  let plus = p, minus = p;
  if (s === 'double') { plus = p * 2; minus = p; }
  else if (s === 'trap') { plus = p; minus = p * 2; }
  else if (s === 'jackpot') { plus = p * 5; minus = p; }
  document.getElementById('kp').textContent = '+' + plus;
  document.getElementById('km').textContent = '-' + minus;
  document.getElementById('vp').textContent = '+' + plus;
  document.getElementById('vm').textContent = '-' + minus;
}

function updateSBlocks() {
  for (let i = 0; i < 2; i++) {
    const b = document.getElementById('sb-' + i);
    const t = document.getElementById('tag-' + i);
    if (i === active) {
      b.classList.remove('locked');
      b.classList.add('active');
      t.classList.remove('hidden');
    } else {
      b.classList.add('locked');
      b.classList.remove('active');
      t.classList.add('hidden');
    }
  }
}

function revealAnswer() {
  sfx('click');
  document.getElementById('m-answer-box').classList.remove('hidden');
  document.getElementById('reveal-wrap').classList.add('hidden');
}

// ============= SCORING =============
function score(idx, correct) {
  if (!cur) return;
  if (idx !== active) { sfx('wrong'); return; }
  const p = cur.points, s = cur.special;

  if (s === 'block') {
    blocked = active === 0 ? 1 : 0;
    sfx('correct');
    finishTurn(false);
    return;
  }

  let delta;
  if (s === 'double') delta = correct ? p * 2 : -p;
  else if (s === 'trap') delta = correct ? p : -p * 2;
  else if (s === 'jackpot') delta = correct ? p * 5 : -p;
  else delta = correct ? p : -p;

  // STREAK BONUS
  if (correct) {
    players[idx].streak = (players[idx].streak || 0) + 1;
    if (players[idx].streak >= 3) {
      delta = Math.round(delta * 1.5);
    }
  } else {
    players[idx].streak = 0;
  }

  if (!correct && Math.abs(delta) >= 400) {
    if (!confirm(`Списать ${Math.abs(delta)} очков у ${players[idx].name}?`)) return;
  }

  if (correct) sfx('correct'); else sfx('wrong');
  players[idx].score += delta;
  pulseScore(idx);

  finishTurn(!correct);
}

function finishTurn(switchTurn) {
  if (curKey) played.add(curKey);
  if (curCell) {
    curCell.classList.add('done');
    curCell.innerHTML = '<i class="fa-solid fa-check"></i>';
  }

  if (switchTurn) {
    let next = active === 0 ? 1 : 0;
    if (blocked !== null && next === blocked) {
      blocked = null;
      next = next === 0 ? 1 : 0;
    }
    active = next;
  }

  save();
  render();
  closeQ(true);
}

function closeQ(skip) {
  if (curKey && !skip) {
    played.add(curKey);
    if (curCell) {
      curCell.classList.add('done');
      curCell.innerHTML = '<i class="fa-solid fa-check"></i>';
    }
    let next = active === 0 ? 1 : 0;
    if (blocked !== null && next === blocked) {
      blocked = null;
      next = next === 0 ? 1 : 0;
    }
    active = next;
    save();
    render();
  }
  document.getElementById('q-overlay').classList.add('hidden');
  cur = null; curCell = null; curKey = null;
  checkDone();
}

// ============= INSTANT =============
function showInstant(isBonus, delta) {
  const icon = document.getElementById('i-icon');
  const title = document.getElementById('i-title');
  const desc = document.getElementById('i-desc');
  if (isBonus) {
    icon.style.background = 'linear-gradient(135deg,var(--emerald),#10B981)';
    icon.innerHTML = '<i class="fa-solid fa-dice"></i>';
    title.textContent = 'Бонус!';
    desc.textContent = `${players[active].name} получает +${delta} очков!`;
  } else {
    icon.style.background = 'linear-gradient(135deg,var(--orange),#F59E0B)';
    icon.innerHTML = '<i class="fa-solid fa-burst"></i>';
    title.textContent = 'Штраф!';
    desc.textContent = `${players[active].name} теряет ${Math.abs(delta)} очков!`;
  }
  document.getElementById('i-overlay').classList.remove('hidden');
}

function closeInstant() {
  document.getElementById('i-overlay').classList.add('hidden');
  let next = active === 0 ? 1 : 0;
  if (blocked !== null && next === blocked) {
    blocked = null;
    next = next === 0 ? 1 : 0;
  }
  active = next;
  save();
  render();
  checkDone();
}

// ============= RANDOM CELL =============
function openRandom() {
  const remaining = [];
  cats.forEach(c => pts.forEach(p => {
    const k = `${c.id}-${p}`;
    if (!played.has(k)) remaining.push({ cat: c, p, key: k });
  }));
  if (!remaining.length) return;
  const pick = remaining[Math.floor(Math.random() * remaining.length)];
  const cell = document.querySelector(`[data-key="${pick.key}"]`);
  // Find the cell element in grid
  let target = null;
  document.querySelectorAll('.cat-col').forEach(col => {
    if (col.querySelector('.cat-header').textContent.includes(pick.cat.name)) {
      target = col.querySelectorAll('.cell')[pts.indexOf(pick.p)];
    }
  });
  if (target) target.click();
}

// ============= WIN =============
function checkDone() {
  const total = cats.length * pts.length;
  if (played.size >= total) {
    setTimeout(() => showWinner(), 500);
  }
}

function showWinner() {
  sfx('win');
  let name = '', desc = '';
  if (players[0].score > players[1].score) { name = 'Кира побеждает!'; desc = `${players[0].score} против ${players[1].score}`; }
  else if (players[1].score > players[0].score) { name = 'Витя побеждает!'; desc = `${players[1].score} против ${players[0].score}`; }
  else { name = 'Ничья!'; desc = `Оба по ${players[0].score}`; }
  document.getElementById('w-name').textContent = name;
  document.getElementById('w-1').textContent = players[1].score;
  document.getElementById('w-0').textContent = players[0].score;
  document.getElementById('w-overlay').classList.remove('hidden');

  if (window.confetti) {
    const end = Date.now() + 3500;
    (function frame() {
      confetti({ particleCount: 8, angle: 60, spread: 60, origin: { x: 0 }, colors: ['#A78BFA','#FF5C9D','#22D3EE','#FBBF24'] });
      confetti({ particleCount: 8, angle: 120, spread: 60, origin: { x: 1 }, colors: ['#A78BFA','#FF5C9D','#22D3EE','#FBBF24'] });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();
  }
}

function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

// ============= RESET =============
function resetGame() {
  if (played.size > 0 && !confirm('Сбросить игру? Все очки и ячейки обнулятся!')) return;
  sfx('click');
  players = [{ name: 'Кира', score: 0, streak: 0 }, { name: 'Витя', score: 0, streak: 0 }];
  active = 0;
  blocked = null;
  played.clear();
  specials = genSpecials();
  localStorage.removeItem(STORAGE);
  save();
  render();
}

// ============= INIT =============
window.addEventListener('DOMContentLoaded', () => {
  load();
  render();
});
</script>

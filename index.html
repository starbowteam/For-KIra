<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>СВОЯ ИГРА • NEO-BRUTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
            --black: #0A0A0A;
            --cream: #FFF5DC;
            --white: #FFFFFF;
            --pink: #FF3D8B;
            --yellow: #FFE24B;
            --cyan: #00CFFF;
            --lime: #A8FF3D;
            --orange: #FF7A2F;
            --purple: #A855F7;
            --green: #22C55E;
            --red: #FF3D3D;
        }
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-drag: none; }
        html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
        body {
            background: var(--cream);
            background-image:
                radial-gradient(circle at 12% 15%, rgba(255, 61, 139, 0.12), transparent 35%),
                radial-gradient(circle at 88% 85%, rgba(0, 207, 255, 0.12), transparent 35%),
                radial-gradient(circle at 50% 50%, rgba(255, 226, 75, 0.08), transparent 50%);
            background-attachment: fixed;
            color: var(--black);
            font-family: 'Space Grotesk', sans-serif;
            height: 100vh; height: 100dvh; height: -webkit-fill-available;
            overflow: hidden;
            padding: max(6px, var(--sat)) max(6px, var(--sar)) max(6px, var(--sab)) max(6px, var(--sal));
            -webkit-font-smoothing: antialiased;
        }
        .display { font-family: 'Archivo Black', sans-serif; letter-spacing: -0.02em; }
        .brutal { background: var(--white); border: 3px solid var(--black); box-shadow: 6px 6px 0 var(--black); }
        .brutal-sm { background: var(--white); border: 2px solid var(--black); box-shadow: 4px 4px 0 var(--black); }
        .brutal-flat { background: var(--white); border: 3px solid var(--black); }
        .brutal-btn { background: var(--white); border: 3px solid var(--black); box-shadow: 4px 4px 0 var(--black); transition: transform 0.08s ease, box-shadow 0.08s ease; cursor: pointer; }
        .brutal-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--black); }
        @media (hover: hover) { .brutal-btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--black); } .brutal-btn:hover:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--black); } }
        .turn-card { transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .turn-card.active-kira { background: var(--pink); color: var(--white); transform: rotate(-1.5deg) scale(1.02); box-shadow: 8px 8px 0 var(--black); }
        .turn-card.active-vitya { background: var(--cyan); transform: rotate(1.5deg) scale(1.02); box-shadow: 8px 8px 0 var(--black); }
        .turn-card.inactive { background: var(--white); opacity: 0.55; }
        .cell { position: relative; background: var(--white); border: 2px solid var(--black); box-shadow: 3px 3px 0 var(--black); transition: transform 0.08s ease, box-shadow 0.08s ease; overflow: hidden; min-height: 44px; cursor: pointer; font-family: 'Archivo Black', sans-serif; }
        .cell:active:not(.cell-done) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--black); }
        @media (hover: hover) { .cell:hover:not(.cell-done) { background: var(--yellow); } }
        .cell-done { opacity: 0.3; pointer-events: none; background: var(--cream); box-shadow: none; border-style: dashed; border-color: #999; }
        .cat-header { border: 2px solid var(--black); box-shadow: 3px 3px 0 var(--black); font-family: 'Archivo Black', sans-serif; color: var(--black); padding: 4px 3px; text-align: center; font-size: 9px; line-height: 1.1; text-transform: uppercase; letter-spacing: -0.02em; font-weight: 900; }
        .no-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .no-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .no-scrollbar::-webkit-scrollbar-thumb { background: var(--black); border-radius: 0; }
        @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .slide-up { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes pop-in { 0% { transform: scale(0.5) rotate(-8deg); opacity: 0; } 70% { transform: scale(1.05) rotate(2deg); } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
        .pop-in { animation: pop-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes pop-big { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        .pop-big { animation: pop-big 0.8s ease-in-out infinite; }
        .score-block-locked { opacity: 0.3; pointer-events: none; }
        .score-block-active { background: var(--yellow) !important; animation: pop-big 1.2s ease-in-out infinite; }
        .badge { display: inline-block; border: 2px solid var(--black); box-shadow: 2px 2px 0 var(--black); padding: 2px 8px; font-family: 'Archivo Black', sans-serif; font-size: 9px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--black); }
        body[data-density="comfortable"] .cell { min-height: 56px; }
        body[data-density="comfortable"] .cell span { font-size: 16px !important; }
        body[data-density="compact"] .cell { min-height: 38px; }
        body[data-density="compact"] .cell span { font-size: 12px !important; }
        #density-btn { display: none; }
        @media (min-width: 768px) { #density-btn { display: flex; } }
        @media (max-width: 640px) { .cell { min-height: 40px; padding: 4px 2px !important; } .cat-header { font-size: 7px; } }
        @media (max-width: 380px) { .cell { min-height: 36px; } .cat-header { font-size: 6px; } }
        @media (max-height: 500px) and (orientation: landscape) { .cell { min-height: 32px !important; padding: 2px !important; } .cell span { font-size: 10px !important; } #turn-status-line { display: none; } }
        @media (min-width: 768px) and (max-width: 1023px) and (orientation: portrait) { #master-grid { grid-template-columns: repeat(4, 1fr) !important; } }
        @media (min-width: 1024px) and (max-width: 1365px) and (orientation: landscape) { #master-grid { grid-template-columns: repeat(6, 1fr) !important; } }
        @media (min-width: 1366px) { #master-grid { grid-template-columns: repeat(12, 1fr) !important; } }
    </style>
</head>
<body class="flex flex-col justify-between h-screen overflow-hidden" data-density="comfortable">

<header class="w-full px-2 sm:px-4 py-1.5 shrink-0 flex items-center justify-between z-30">
    <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-lg flex items-center justify-center text-lg sm:text-2xl shrink-0 brutal" style="background: var(--yellow); transform: rotate(-4deg);">⚡</div>
        <div class="min-w-0">
            <h1 class="display text-[11px] sm:text-sm uppercase leading-none truncate">СВОЯ ИГРА</h1>
            <p class="text-[7px] sm:text-[9px] font-bold uppercase tracking-widest mt-0.5 truncate">120 ВОПРОСОВ • NEO-BRUTAL</p>
        </div>
    </div>
    <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <button id="density-btn" onclick="toggleDensity()" class="w-9 h-9 sm:w-10 sm:h-10 rounded-lg brutal-btn items-center justify-center text-sm" style="background: var(--lime);"><i class="fa-solid fa-table-cells-large" id="density-icon"></i></button>
        <button onclick="toggleAudioMute()" class="w-9 h-9 sm:w-10 sm:h-10 rounded-lg brutal-btn flex items-center justify-center text-sm" style="background: var(--cyan);"><i class="fa-solid fa-volume-high" id="mute-icon"></i></button>
        <button onclick="showWinnerModal(true)" class="px-2 sm:px-4 h-9 sm:h-10 rounded-lg brutal-btn font-black text-[9px] sm:text-[11px] flex items-center gap-1.5 uppercase display" style="background: var(--pink); color: var(--white);"><i class="fa-solid fa-crown text-[10px]"></i> <span class="hidden sm:inline">ИТОГИ</span></button>
    </div>
</header>

<section class="px-2 sm:px-4 pt-1 pb-2 w-full max-w-6xl mx-auto shrink-0">
    <div class="grid grid-cols-2 gap-2 sm:gap-4">
        <div id="player-card-0" class="turn-card brutal rounded-xl px-2.5 py-2 sm:px-4 sm:py-3 flex items-center justify-between relative">
            <div class="flex items-center gap-2 sm:gap-3 min-w-0">
                <div class="w-9 h-9 sm:w-12 sm:h-12 rounded-lg flex items-center justify-center text-lg sm:text-2xl shrink-0 brutal-flat" style="background: var(--pink);">👩‍🦰</div>
                <div class="min-w-0">
                    <div class="display text-xs sm:text-base uppercase leading-tight truncate">Кира</div>
                    <span id="turn-badge-0" class="hidden text-[8px] sm:text-[9px] font-black uppercase tracking-wider mt-0.5 inline-block">→ ХОДИТ!</span>
                </div>
            </div>
            <div class="text-right shrink-0">
                <div id="score-0" class="display text-lg sm:text-3xl leading-none">0</div>
                <div class="text-[7px] sm:text-[9px] font-bold uppercase tracking-widest mt-0.5 opacity-70">очков</div>
            </div>
        </div>
        <div id="player-card-1" class="turn-card brutal rounded-xl px-2.5 py-2 sm:px-4 sm:py-3 flex items-center justify-between relative">
            <div class="flex items-center gap-2 sm:gap-3 min-w-0">
                <div class="w-9 h-9 sm:w-12 sm:h-12 rounded-lg flex items-center justify-center text-lg sm:text-2xl shrink-0 brutal-flat" style="background: var(--cyan);">🧑‍💻</div>
                <div class="min-w-0">
                    <div class="display text-xs sm:text-base uppercase leading-tight truncate">Витя</div>
                    <span id="turn-badge-1" class="hidden text-[8px] sm:text-[9px] font-black uppercase tracking-wider mt-0.5 inline-block">→ ХОДИТ!</span>
                </div>
            </div>
            <div class="text-right shrink-0">
                <div id="score-1" class="display text-lg sm:text-3xl leading-none">0</div>
                <div class="text-[7px] sm:text-[9px] font-bold uppercase tracking-widest mt-0.5 opacity-70">очков</div>
            </div>
        </div>
    </div>
    <div class="mt-2 text-center">
        <div class="inline-block px-3 py-1 brutal-sm rounded-full text-[9px] sm:text-[11px] font-black uppercase"><span id="turn-status-line">Ход: Кира</span></div>
    </div>
</section>

<main class="flex-1 px-2 sm:px-4 pb-2 w-full max-w-[1800px] mx-auto flex flex-col overflow-hidden">
    <div class="brutal rounded-2xl p-1.5 sm:p-2 h-full flex flex-col overflow-hidden">
        <div id="master-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-12 gap-1.5 sm:gap-2 h-full overflow-y-auto no-scrollbar"></div>
    </div>
</main>

<footer class="px-3 sm:px-4 py-1.5 w-full max-w-6xl mx-auto shrink-0 flex justify-between items-center z-20">
    <button onclick="resetGame(true)" class="px-3 py-1.5 rounded-lg brutal-btn text-[9px] sm:text-[10px] font-black uppercase display flex items-center gap-1.5" style="background: var(--red); color: var(--white);"><i class="fa-solid fa-rotate-right"></i> СБРОС</button>
    <span class="text-[8px] sm:text-[9px] font-black uppercase tracking-widest opacity-50">12 × 10 • BRUTAL</span>
</footer>

<div id="question-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex flex-col justify-end z-50">
    <div class="brutal rounded-t-3xl w-full max-w-xl mx-auto p-4 sm:p-6 flex flex-col justify-between max-h-[95vh] overflow-y-auto slide-up" style="border-bottom: none; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 0 var(--black);">
        <div class="w-16 h-2 rounded-full mx-auto mb-4" style="background: var(--black);"></div>
        <div class="flex justify-between items-center pb-3 mb-3 border-b-2 border-black">
            <div class="flex items-center gap-1.5 flex-wrap">
                <span id="modal-category" class="badge" style="background: var(--yellow);">Категория</span>
                <span id="modal-points" class="badge" style="background: var(--pink); color: var(--white);">500</span>
                <span id="modal-special" class="hidden badge"></span>
            </div>
            <div class="text-[10px] sm:text-xs font-black uppercase">Ход: <span id="modal-player-turn" class="underline">Кира</span></div>
        </div>
        <div class="my-auto py-3 text-center flex flex-col items-center justify-center">
            <div class="text-[9px] sm:text-[10px] font-black uppercase tracking-widest mb-3 px-2 py-1 brutal-sm rounded" id="modal-difficulty-hint">Сложность</div>
            <p id="modal-question-text" class="display text-lg sm:text-2xl leading-tight px-1">Текст вопроса...</p>
            <div id="modal-answer-box" class="hidden mt-4 w-full p-3 sm:p-4 rounded-xl brutal-flat pop-in" style="background: var(--lime);">
                <div class="text-[9px] sm:text-[10px] font-black uppercase tracking-widest mb-2">✓ ОТВЕТ:</div>
                <div id="modal-answer-text" class="display text-sm sm:text-lg leading-tight"></div>
            </div>
            <div id="modal-special-warning" class="hidden mt-3 w-full p-3 sm:p-4 rounded-xl brutal-flat text-center"></div>
        </div>
        <div class="pt-3 border-t-2 border-black">
            <div id="action-reveal-container" class="mb-3">
                <button onclick="revealAnswer()" class="w-full py-3 sm:py-4 rounded-xl brutal-btn font-black text-sm sm:text-base uppercase display" style="background: var(--yellow);"><i class="fa-solid fa-key mr-1"></i> ПОКАЗАТЬ ОТВЕТ</button>
            </div>
            <div id="score-buttons-container" class="grid grid-cols-2 gap-2 sm:gap-3">
                <div id="score-block-0" class="brutal-flat rounded-xl p-2.5 sm:p-3 text-center flex flex-col gap-2 transition-all" style="background: var(--white);">
                    <div class="text-[10px] sm:text-xs font-black uppercase display flex items-center justify-center gap-1">👩‍🦰 КИРА <span id="turn-tag-0" class="hidden text-[8px] px-1.5 py-0.5 brutal-sm rounded bg-white">ХОД</span></div>
                    <div class="flex gap-1.5">
                        <button onclick="scorePlayer(0, true)" class="flex-1 py-2 sm:py-3 rounded-lg brutal-btn font-black text-[11px] sm:text-sm" style="background: var(--green); color: var(--white);"><i class="fa-solid fa-plus text-[9px] mr-0.5"></i><span id="btn-kira-plus">+100</span></button>
                        <button onclick="scorePlayer(0, false)" class="flex-1 py-2 sm:py-3 rounded-lg brutal-btn font-black text-[11px] sm:text-sm" style="background: var(--red); color: var(--white);"><i class="fa-solid fa-minus text-[9px] mr-0.5"></i><span id="btn-kira-minus">-100</span></button>
                    </div>
                </div>
                <div id="score-block-1" class="brutal-flat rounded-xl p-2.5 sm:p-3 text-center flex flex-col gap-2 transition-all" style="background: var(--white);">
                    <div class="text-[10px] sm:text-xs font-black uppercase display flex items-center justify-center gap-1">🧑‍💻 ВИТЯ <span id="turn-tag-1" class="hidden text-[8px] px-1.5 py-0.5 brutal-sm rounded bg-white">ХОД</span></div>
                    <div class="flex gap-1.5">
                        <button onclick="scorePlayer(1, true)" class="flex-1 py-2 sm:py-3 rounded-lg brutal-btn font-black text-[11px] sm:text-sm" style="background: var(--green); color: var(--white);"><i class="fa-solid fa-plus text-[9px] mr-0.5"></i><span id="btn-vitya-plus">+100</span></button>
                        <button onclick="scorePlayer(1, false)" class="flex-1 py-2 sm:py-3 rounded-lg brutal-btn font-black text-[11px] sm:text-sm" style="background: var(--red); color: var(--white);"><i class="fa-solid fa-minus text-[9px] mr-0.5"></i><span id="btn-vitya-minus">-100</span></button>
                    </div>
                </div>
            </div>
            <div class="mt-3 text-center">
                <button onclick="closeQuestionModal()" class="text-[10px] sm:text-[11px] font-black uppercase underline opacity-50 hover:opacity-100 py-1">Пропустить → передать ход</button>
            </div>
        </div>
    </div>
</div>

<div id="instant-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div id="instant-card" class="brutal rounded-3xl max-w-md w-full p-6 sm:p-8 text-center pop-in" style="transform: rotate(-2deg);">
        <div id="instant-icon" class="w-24 h-24 sm:w-32 sm:h-32 rounded-2xl flex items-center justify-center text-5xl sm:text-7xl mx-auto mb-4 brutal-flat pop-big"></div>
        <h2 id="instant-title" class="display text-2xl sm:text-4xl uppercase mb-3"></h2>
        <p id="instant-desc" class="text-sm sm:text-base font-bold mb-6"></p>
        <button onclick="closeInstantModal()" class="w-full py-3 sm:py-4 rounded-xl brutal-btn font-black text-sm sm:text-base uppercase display" style="background: var(--yellow);">ПРОДОЛЖИТЬ →</button>
    </div>
</div>

<div id="winner-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="brutal rounded-3xl max-w-md w-full p-6 sm:p-8 text-center pop-in" style="transform: rotate(-1deg);">
        <div class="w-20 h-20 sm:w-28 sm:h-28 rounded-2xl flex items-center justify-center text-4xl sm:text-6xl mx-auto mb-4 brutal-flat" style="background: var(--yellow); transform: rotate(4deg);">👑</div>
        <h2 class="display text-2xl sm:text-3xl uppercase mb-2">ФИНАЛ!</h2>
        <p class="text-[10px] sm:text-xs font-black uppercase tracking-widest opacity-60 mb-4">120 вопросов сыграно</p>
        <p id="winner-name" class="display text-lg sm:text-2xl my-3"></p>
        <p id="winner-score" class="text-xs sm:text-sm font-bold mb-5"></p>
        <div class="grid grid-cols-2 gap-3 mb-5">
            <div class="brutal-flat rounded-xl p-3" style="background: var(--pink); color: var(--white);"><div class="display text-[10px] sm:text-xs uppercase mb-1">КИРА</div><div id="final-score-0" class="display text-2xl sm:text-3xl">0</div></div>
            <div class="brutal-flat rounded-xl p-3" style="background: var(--cyan);"><div class="display text-[10px] sm:text-xs uppercase mb-1">ВИТЯ</div><div id="final-score-1" class="display text-2xl sm:text-3xl">0</div></div>
        </div>
        <button onclick="resetGame(true); closeModal('winner-modal');" class="w-full py-3 sm:py-4 rounded-xl brutal-btn font-black text-sm sm:text-base uppercase display" style="background: var(--yellow);">СЫГРАТЬ СНОВА 🔥</button>
    </div>
</div>

<script>
// ========== STATE ==========
let players = [{ name: "Кира", score: 0 }, { name: "Витя", score: 0 }];
let activePlayerIndex = 0;
let currentQuestion = null;
let activeCellElement = null;
let activeCellKey = null;
let isAudioMuted = false;
let blockedPlayerIndex = null;

const STORAGE_KEY = 'jeopardy_brutal_12x10_v12';
const DENSITY_KEY = 'jeopardy_brutal_density';
let playedQuestions = new Set();
let specialCells = {};

// ========== CATEGORIES ==========
const categories = [
    { id: 'angarsk', name: 'Ангарск', color: '#FF7A2F', icon: 'fa-location-dot' },
    { id: 'brawl', name: 'Brawl Stars', color: '#FF3D8B', icon: 'fa-skull-crossbones' },
    { id: 'memes', name: 'Мемы', color: '#A855F7', icon: 'fa-fire' },
    { id: 'music', name: 'Музыка', color: '#00CFFF', icon: 'fa-music' },
    { id: 'youtube', name: 'YouTube RU', color: '#FF3D3D', icon: 'fa-play-circle' },
    { id: 'animals', name: 'Животные', color: '#22C55E', icon: 'fa-paw' },
    { id: 'food', name: 'Еда', color: '#FFE24B', icon: 'fa-burger' },
    { id: 'sport', name: 'Спорт', color: '#3B82F6', icon: 'fa-futbol' },
    { id: 'nature', name: 'Природа', color: '#A8FF3D', icon: 'fa-leaf' },
    { id: 'cartoons', name: 'Мультфильмы', color: '#FFB347', icon: 'fa-tv' },
    { id: 'school', name: 'Школа', color: '#C4B5FD', icon: 'fa-graduation-cap' },
    { id: 'space', name: 'Космос', color: '#818CF8', icon: 'fa-rocket' }
];

const pointValues = [100, 200, 300, 400, 500, 600, 700, 800, 900, 1000];

function getDifficulty(points) {
    if (points <= 200) return { label: '🌱 РАЗМИНКА' };
    if (points <= 400) return { label: '⚡ ЛЕГКО' };
    if (points <= 600) return { label: '🎯 СРЕДНЕ' };
    if (points <= 800) return { label: '🔥 СЛОЖНО' };
    if (points <= 900) return { label: '💀 ОЧЕНЬ СЛОЖНО' };
    return { label: '👑 ХАРДКОР' };
}

// ========== СПЕЦЯЧЕЙКИ ==========
function generateSpecialCells() {
    const map = {};
    const types = [
        { type: 'double', count: 6 },
        { type: 'trap', count: 6 },
        { type: 'jackpot', count: 3 },
        { type: 'block', count: 3 },
        { type: 'bonus', count: 5 },
        { type: 'penalty', count: 5 }
    ];
    const allKeys = [];
    categories.forEach(c => pointValues.forEach(p => allKeys.push(`${c.id}-${p}`)));
    for (let i = allKeys.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allKeys[i], allKeys[j]] = [allKeys[j], allKeys[i]];
    }
    let idx = 0;
    types.forEach(t => {
        for (let i = 0; i < t.count && idx < allKeys.length; i++, idx++) {
            map[allKeys[idx]] = { type: t.type };
        }
    });
    return map;
}

function getSpecialInfo(key) {
    const s = specialCells[key];
    if (!s) return null;
    if (s.type === 'double') return { emoji: '💎', label: '×2', bg: '#00CFFF' };
    if (s.type === 'trap') return { emoji: '⚠️', label: 'ЛОВУШКА', bg: '#FF3D3D', white: true };
    if (s.type === 'jackpot') return { emoji: '🎁', label: '×5', bg: '#A855F7', white: true };
    if (s.type === 'block') return { emoji: '🚫', label: 'БЛОК', bg: '#6B7280', white: true };
    if (s.type === 'bonus') return { emoji: '🎲', label: 'БОНУС', bg: '#A8FF3D' };
    if (s.type === 'penalty') return { emoji: '💥', label: 'ШТРАФ', bg: '#FF7A2F', white: true };
    return null;
}

// ========== AUDIO ==========
let audioCtx = null;
function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}
function toggleAudioMute() {
    isAudioMuted = !isAudioMuted;
    const icon = document.getElementById('mute-icon');
    icon.className = isAudioMuted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
}
function playSound(type) {
    if (isAudioMuted) return;
    try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        if (type === 'click') {
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.frequency.setValueAtTime(500, now);
            o.frequency.exponentialRampToValueAtTime(900, now + 0.04);
            g.gain.setValueAtTime(0.05, now);
            g.gain.linearRampToValueAtTime(0.01, now + 0.04);
            o.start(now); o.stop(now + 0.04);
        } else if (type === 'reveal') {
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(400, now);
            o.frequency.exponentialRampToValueAtTime(700, now + 0.1);
            g.gain.setValueAtTime(0.08, now);
            g.gain.linearRampToValueAtTime(0.01, now + 0.1);
            o.start(now); o.stop(now + 0.1);
        } else if (type === 'correct') {
            [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.frequency.setValueAtTime(f, now + i * 0.05);
                g.gain.setValueAtTime(0.07, now + i * 0.05);
                g.gain.linearRampToValueAtTime(0.01, now + i * 0.05 + 0.12);
                o.start(now + i * 0.05); o.stop(now + i * 0.05 + 0.12);
            });
        } else if (type === 'wrong') {
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(220, now);
            o.frequency.linearRampToValueAtTime(80, now + 0.18);
            g.gain.setValueAtTime(0.08, now);
            g.gain.linearRampToValueAtTime(0.01, now + 0.18);
            o.start(now); o.stop(now + 0.18);
        } else if (type === 'win') {
            [440, 554.37, 659.25, 880, 1046.50].forEach((f, i) => {
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.type = 'triangle';
                o.frequency.setValueAtTime(f, now + i * 0.07);
                g.gain.setValueAtTime(0.1, now + i * 0.07);
                g.gain.linearRampToValueAtTime(0.01, now + i * 0.07 + 0.2);
                o.start(now + i * 0.07); o.stop(now + i * 0.07 + 0.2);
            });
        }
    } catch(e) {}
}

// ========== DENSITY ==========
function applyDensity(mode) {
    document.body.setAttribute('data-density', mode);
    const icon = document.getElementById('density-icon');
    icon.className = mode === 'comfortable' ? 'fa-solid fa-table-cells-large' : 'fa-solid fa-table-cells';
    try { localStorage.setItem(DENSITY_KEY, mode); } catch(e) {}
}
function toggleDensity() {
    const current = document.body.getAttribute('data-density') || 'comfortable';
    applyDensity(current === 'comfortable' ? 'compact' : 'comfortable');
    playSound('click');
}

// ========== PERSISTENCE ==========
function loadState() {
    try {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) {
            const parsed = JSON.parse(data);
            if (parsed.playedQuestions) playedQuestions = new Set(parsed.playedQuestions);
            if (parsed.players) players = parsed.players;
            if (parsed.activePlayerIndex !== undefined) activePlayerIndex = parsed.activePlayerIndex;
            if (parsed.blockedPlayerIndex !== undefined) blockedPlayerIndex = parsed.blockedPlayerIndex;
            if (parsed.specialCells && Object.keys(parsed.specialCells).length > 0) {
                specialCells = parsed.specialCells;
            } else {
                specialCells = generateSpecialCells();
                saveState();
            }
        } else {
            specialCells = generateSpecialCells();
        }
    } catch (e) { specialCells = generateSpecialCells(); }
    try {
        const d = localStorage.getItem(DENSITY_KEY);
        if (d) applyDensity(d); else applyDensity('comfortable');
    } catch(e) { applyDensity('comfortable'); }
}
function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            playedQuestions: Array.from(playedQuestions),
            players: players,
            activePlayerIndex: activePlayerIndex,
            blockedPlayerIndex: blockedPlayerIndex,
            specialCells: specialCells
        }));
    } catch (e) {}
}

// ========== GRID ==========
function initGrid() {
    const masterGrid = document.getElementById('master-grid');
    masterGrid.innerHTML = '';
    categories.forEach(cat => {
        const colDiv = document.createElement('div');
        colDiv.className = 'flex flex-col gap-1.5 h-full overflow-hidden';
        const headerDiv = document.createElement('div');
        headerDiv.className = 'shrink-0';
        headerDiv.innerHTML = `<div class="cat-header rounded-lg" style="background: ${cat.color};">${cat.name}</div>`;
        colDiv.appendChild(headerDiv);
        const tiersDiv = document.createElement('div');
        tiersDiv.className = 'flex flex-col gap-1 sm:gap-1.5 overflow-y-auto no-scrollbar flex-1';
        pointValues.forEach(points => {
            const key = `${cat.id}-${points}`;
            const isPlayed = playedQuestions.has(key);
            const btn = document.createElement('button');
            btn.className = `cell rounded-lg flex items-center justify-center ${isPlayed ? 'cell-done' : ''}`;
            btn.dataset.key = key;
            if (isPlayed) {
                btn.innerHTML = `<i class="fa-solid fa-check" style="color: #999;"></i>`;
            } else {
                btn.innerHTML = `<span class="display" style="color: var(--black);">${points}</span>`;
            }
            btn.onclick = () => openQuestion(btn, key, cat.id, cat.name, points);
            tiersDiv.appendChild(btn);
        });
        colDiv.appendChild(tiersDiv);
        masterGrid.appendChild(colDiv);
    });
    updateTurnUI();
}

        const card = document.getElementById(`player-card-${idx}`);
        const badge = document.getElementById(`turn-badge-${idx}`);
        document.getElementById(`score-${idx}`).innerText = p.score;
        if (idx === activePlayerIndex) {
            card.className = `turn-card brutal rounded-xl px-2.5 py-2 sm:px-4 sm:py-3 flex items-center justify-between relative ${idx === 0 ? 'active-kira' : 'active-vitya'}`;
            badge.classList.remove('hidden');
        } else {
            card.className = 'turn-card brutal rounded-xl px-2.5 py-2 sm:px-4 sm:py-3 flex items-center justify-between relative inactive';
            badge.classList.add('hidden');
        }
    });
    const statusLine = document.getElementById('turn-status-line');
    let statusText = `Ход: <strong>${players[activePlayerIndex].name}</strong>`;
    if (blockedPlayerIndex !== null) statusText += ` • 🚫 ${players[blockedPlayerIndex].name} пропускает`;
    statusLine.innerHTML = statusText;
    updateScoreButtonStates();
}
function updateScoreButtonStates() {
    if (!currentQuestion) return;
    for (let i = 0; i < 2; i++) {
        const block = document.getElementById(`score-block-${i}`);
        const tag = document.getElementById(`turn-tag-${i}`);
        if (!block || !tag) continue;
        if (i === activePlayerIndex) {
            block.classList.remove('score-block-locked');
            block.classList.add('score-block-active');
            tag.classList.remove('hidden');
        } else {
            block.classList.add('score-block-locked');
            block.classList.remove('score-block-active');
            tag.classList.add('hidden');
        }
    }
}

// ========== QUESTION MODAL ==========
function openQuestion(btnEl, key, catId, catName, points) {
    if (playedQuestions.has(key) || btnEl.classList.contains('cell-done')) return;
    playSound('click');
    activeCellElement = btnEl;
    activeCellKey = key;
    const diffInfo = getDifficulty(points);
    const special = getSpecialInfo(key);

    if (special && (specialCells[key].type === 'bonus' || specialCells[key].type === 'penalty')) {
        const isBonus = specialCells[key].type === 'bonus';
        const delta = isBonus ? points : -points;
        players[activePlayerIndex].score += delta;
        if (isBonus) playSound('correct'); else playSound('wrong');
        showInstantModal(isBonus, delta);
        playedQuestions.add(key);
        if (activeCellElement) {
            activeCellElement.classList.add('cell-done');
            activeCellElement.innerHTML = `<i class="fa-solid fa-check" style="color: #999;"></i>`;
        }
        saveState();
        updateTurnUI();
        return;
    }

    currentQuestion = {
        key: key, catId: catId, category: catName,
        points: parseInt(points),
        data: questionsDatabase[catId][points],
        special: special ? specialCells[key].type : null
    };
    document.getElementById('modal-category').innerText = catName;
    document.getElementById('modal-category').style.background = categories.find(c => c.id === catId).color;
    document.getElementById('modal-points').innerText = `${points} PTS`;
    document.getElementById('modal-difficulty-hint').innerText = diffInfo.label;
    document.getElementById('modal-player-turn').innerText = players[activePlayerIndex].name;
    document.getElementById('modal-question-text').innerText = currentQuestion.data.q;
    document.getElementById('modal-answer-text').innerText = currentQuestion.data.a;

    const specialBadge = document.getElementById('modal-special');
    if (special) {
        specialBadge.classList.remove('hidden');
        specialBadge.style.background = special.bg;
        specialBadge.style.color = special.white ? '#FFFFFF' : '#0A0A0A';
        specialBadge.innerText = `${special.emoji} ${special.label}`;
    } else specialBadge.classList.add('hidden');

    const warnBox = document.getElementById('modal-special-warning');
    if (currentQuestion.special === 'double') {
        warnBox.style.background = 'var(--cyan)';
        warnBox.innerHTML = `<div class="display text-xs sm:text-sm mb-1">💎 ×2 УДВОЕНИЕ</div><div class="text-xs sm:text-sm font-bold">Верно → <strong>+${points * 2}</strong><br>Ошибка → <strong>-${points}</strong></div>`;
        warnBox.classList.remove('hidden');
    } else if (currentQuestion.special === 'trap') {
        warnBox.style.background = 'var(--red)'; warnBox.style.color = '#FFFFFF';
        warnBox.innerHTML = `<div class="display text-xs sm:text-sm mb-1">⚠️ ЛОВУШКА</div><div class="text-xs sm:text-sm font-bold">Верно → <strong>+${points}</strong><br>Ошибка → <strong>-${points * 2}</strong></div>`;
        warnBox.classList.remove('hidden');
    } else if (currentQuestion.special === 'jackpot') {
        warnBox.style.background = 'var(--purple)'; warnBox.style.color = '#FFFFFF';
        warnBox.innerHTML = `<div class="display text-xs sm:text-sm mb-1">🎁 ДЖЕКПОТ ×5</div><div class="text-xs sm:text-sm font-bold">Верно → <strong>+${points * 5}</strong>!!!<br>Ошибка → <strong>-${points}</strong></div>`;
        warnBox.classList.remove('hidden');
    } else if (currentQuestion.special === 'block') {
        warnBox.style.background = '#6B7280'; warnBox.style.color = '#FFFFFF';
        warnBox.innerHTML = `<div class="display text-xs sm:text-sm mb-1">🚫 БЛОКИРОВКА</div><div class="text-xs sm:text-sm font-bold">Соперник пропустит следующий ход!</div>`;
        warnBox.classList.remove('hidden');
    } else {
        warnBox.classList.add('hidden'); warnBox.style.color = '';
    }

    updateScoreButtonLabels();
    document.getElementById('modal-answer-box').classList.add('hidden');
    document.getElementById('action-reveal-container').classList.remove('hidden');
    document.getElementById('question-modal').classList.remove('hidden');
    updateScoreButtonStates();
}

function updateScoreButtonLabels() {
    const p = currentQuestion.points;
    const s = currentQuestion.special;
    let plusVal = p, minusVal = p;
    if (s === 'double') { plusVal = p * 2; minusVal = p; }
    else if (s === 'trap') { plusVal = p; minusVal = p * 2; }
    else if (s === 'jackpot') { plusVal = p * 5; minusVal = p; }
    document.getElementById('btn-kira-plus').innerText = `+${plusVal}`;
    document.getElementById('btn-kira-minus').innerText = `-${minusVal}`;
    document.getElementById('btn-vitya-plus').innerText = `+${plusVal}`;
    document.getElementById('btn-vitya-minus').innerText = `-${minusVal}`;
}
function revealAnswer() {
    playSound('reveal');
    document.getElementById('modal-answer-box').classList.remove('hidden');
    document.getElementById('action-reveal-container').classList.add('hidden');
}

// ========== INSTANT MODAL ==========
function showInstantModal(isBonus, delta) {
    const card = document.getElementById('instant-card');
    const icon = document.getElementById('instant-icon');
    const title = document.getElementById('instant-title');
    const desc = document.getElementById('instant-desc');
    if (isBonus) {
        card.style.background = 'var(--lime)';
        icon.style.background = 'var(--white)';
        icon.innerText = '🎲';
        title.innerText = 'БОНУС!';
        desc.innerText = `${players[activePlayerIndex].name} получает +${delta} очков!`;
    } else {
        card.style.background = 'var(--orange)';
        icon.style.background = 'var(--white)';
        icon.innerText = '💥';
        title.innerText = 'ШТРАФ!';
        desc.innerText = `${players[activePlayerIndex].name} теряет ${Math.abs(delta)} очков!`;
    }
    document.getElementById('instant-modal').classList.remove('hidden');
}
function closeInstantModal() {
    document.getElementById('instant-modal').classList.add('hidden');
    let next = activePlayerIndex === 0 ? 1 : 0;
    if (blockedPlayerIndex !== null && next === blockedPlayerIndex) {
        blockedPlayerIndex = null;
        next = next === 0 ? 1 : 0;
    }
    activePlayerIndex = next;
    saveState();
    updateTurnUI();
    checkGameCompletion();
}

// ========== SCORING ==========
function scorePlayer(playerIdx, isCorrect) {
    if (!currentQuestion) return;
    if (playerIdx !== activePlayerIndex) { playSound('wrong'); return; }
    const p = currentQuestion.points;
    const s = currentQuestion.special;

    if (s === 'block') {
        blockedPlayerIndex = activePlayerIndex === 0 ? 1 : 0;
        playSound('correct');
        finishTurn(false);
        return;
    }

    let delta = 0;
    if (s === 'double') delta = isCorrect ? p * 2 : -p;
    else if (s === 'trap') delta = isCorrect ? p : -p * 2;
    else if (s === 'jackpot') delta = isCorrect ? p * 5 : -p;
    else delta = isCorrect ? p : -p;

    if (!isCorrect && Math.abs(delta) >= 400) {
        if (!confirm(`Списать ${Math.abs(delta)} очков у ${players[playerIdx].name}?`)) return;
    }
    if (isCorrect) playSound('correct'); else playSound('wrong');
    players[playerIdx].score += delta;
    finishTurn(!isCorrect);
}

function finishTurn(switchPlayer) {
    if (activeCellKey) playedQuestions.add(activeCellKey);
    if (activeCellElement) {
        activeCellElement.classList.add('cell-done');
        activeCellElement.innerHTML = `<i class="fa-solid fa-check" style="color: #999;"></i>`;
    }
    if (switchPlayer) {
        let next = activePlayerIndex === 0 ? 1 : 0;
        if (blockedPlayerIndex !== null && next === blockedPlayerIndex) {
            blockedPlayerIndex = null;
            next = next === 0 ? 1 : 0;
        }
        activePlayerIndex = next;
    }
    saveState();
    updateTurnUI();
    closeQuestionModal(true);
}

function closeQuestionModal(skipDisable = false) {
    if (activeCellKey && !skipDisable) {
        playedQuestions.add(activeCellKey);
        if (activeCellElement) {
            activeCellElement.classList.add('cell-done');
            activeCellElement.innerHTML = `<i class="fa-solid fa-check" style="color: #999;"></i>`;
        }
        let next = activePlayerIndex === 0 ? 1 : 0;
        if (blockedPlayerIndex !== null && next === blockedPlayerIndex) {
            blockedPlayerIndex = null;
            next = next === 0 ? 1 : 0;
        }
        activePlayerIndex = next;
        saveState();
        updateTurnUI();
    }
    document.getElementById('question-modal').classList.add('hidden');
    document.getElementById('modal-special-warning').classList.add('hidden');
    document.getElementById('modal-special').classList.add('hidden');
    activeCellElement = null;
    activeCellKey = null;
    currentQuestion = null;
    checkGameCompletion();
}
function closeModal(modalId) { document.getElementById(modalId).classList.add('hidden'); }
function checkGameCompletion() {
    const total = categories.length * pointValues.length;
    if (playedQuestions.size >= total) setTimeout(() => showWinnerModal(), 400);
}

function showWinnerModal() {
    playSound('win');
    let winnerText = "", winnerScoreText = "";
    if (players[0].score > players[1].score) { winnerText = "👑 КИРА ПОБЕДИЛА!"; winnerScoreText = `С результатом ${players[0].score} очков!`; }
    else if (players[1].score > players[0].score) { winnerText = "👑 ВИТЯ ПОБЕДИЛ!"; winnerScoreText = `С результатом ${players[1].score} очков!`; }
    else { winnerText = "🤝 НИЧЬЯ!"; winnerScoreText = `Оба набрали по ${players[0].score} очков!`; }
    document.getElementById('winner-name').innerText = winnerText;
    document.getElementById('winner-score').innerText = winnerScoreText;
    document.getElementById('final-score-0').innerText = players[0].score;
    document.getElementById('final-score-1').innerText = players[1].score;
    document.getElementById('winner-modal').classList.remove('hidden');
    if (window.confetti) {
        const duration = 3500, end = Date.now() + duration;
        (function frame() {
            confetti({ particleCount: 8, angle: 60, spread: 60, origin: { x: 0 }, colors: ['#FF3D8B', '#FFE24B', '#00CFFF', '#A8FF3D', '#FF7A2F'] });
            confetti({ particleCount: 8, angle: 120, spread: 60, origin: { x: 1 }, colors: ['#FF3D8B', '#FFE24B', '#00CFFF', '#A8FF3D', '#FF7A2F'] });
            if (Date.now() < end) requestAnimationFrame(frame);
        })();
    }
}

function resetGame(confirmReset = false) {
    if (confirmReset && !confirm("Сбросить игру? Позиции спецячеек перемешаются!")) return;
    playSound('click');
    players[0].score = 0;
    players[1].score = 0;
    activePlayerIndex = 0;
    blockedPlayerIndex = null;
    playedQuestions.clear();
    specialCells = generateSpecialCells();
    localStorage.removeItem(STORAGE_KEY);
    saveState();
    initGrid();
}

window.onload = function() {
    loadState();
    initGrid();
};
</script>

<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>СВОЯ ИГРА • PIXEL EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
            --black: #0A0A0A;
            --cream: #FFF8E7;
            --white: #FFFFFF;
            --pink: #FF5C8A;
            --yellow: #FFD93D;
            --cyan: #4ECDC4;
            --lime: #A8FF3D;
            --orange: #FF8C42;
            --purple: #A855F7;
            --green: #22C55E;
            --red: #FF3D3D;
            --blue: #3B82F6;
        }
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-drag: none; box-sizing: border-box; }
        html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; margin: 0; }
        
        body {
            background: var(--cream);
            background-image:
                radial-gradient(circle at 12% 15%, rgba(255, 92, 138, 0.10), transparent 35%),
                radial-gradient(circle at 88% 85%, rgba(78, 205, 196, 0.10), transparent 35%),
                radial-gradient(circle at 50% 50%, rgba(255, 217, 61, 0.08), transparent 50%);
            background-attachment: fixed;
            color: var(--black);
            font-family: 'Space Grotesk', sans-serif;
            height: 100vh;
            height: 100dvh;
            height: -webkit-fill-available;
            overflow: hidden;
            padding: max(6px, var(--sat)) max(6px, var(--sar)) max(6px, var(--sab)) max(6px, var(--sal));
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(10,10,10,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10,10,10,0.035) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
            z-index: 0;
        }
        body > * { position: relative; z-index: 1; }

        .display { font-family: 'Press Start 2P', monospace; letter-spacing: -0.02em; line-height: 1.2; }
        .pixel { font-family: 'Pixelify Sans', sans-serif; letter-spacing: 0.01em; }

        .brutal {
            background: var(--white);
            border: 3px solid var(--black);
            box-shadow: 5px 5px 0 var(--black), 10px 10px 0 rgba(10,10,10,0.08);
        }
        .brutal-flat {
            background: var(--white);
            border: 3px solid var(--black);
        }
        .brutal-sm {
            background: var(--white);
            border: 2px solid var(--black);
            box-shadow: 3px 3px 0 var(--black);
        }

        /* ========== HEADER ========== */
        .top-header {
            flex-shrink: 0;
            width: 100%;
            padding: 4px 4px 8px 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .brand-icon {
            width: 44px; height: 44px;
            background: var(--yellow);
            border: 3px solid var(--black);
            box-shadow: 4px 4px 0 var(--black);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            transform: rotate(-4deg);
            flex-shrink: 0;
        }
        .brand-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            letter-spacing: -0.02em;
            line-height: 1.3;
        }
        .brand-sub {
            font-family: 'Pixelify Sans', sans-serif;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.65;
            margin-top: 2px;
        }

        .top-btn {
            height: 40px;
            min-width: 40px;
            padding: 0 10px;
            border: 3px solid var(--black);
            box-shadow: 3px 3px 0 var(--black);
            border-radius: 8px;
            font-family: 'Pixelify Sans', sans-serif;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            color: var(--black);
        }
        .top-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--black); }
        @media (hover: hover) {
            .top-btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--black); }
            .top-btn:hover:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--black); }
        }

        /* ========== PLAYERS ========== */
        .players-row {
            flex-shrink: 0;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 0 4px 10px 4px;
        }
        .player-card {
            background: var(--white);
            border: 3px solid var(--black);
            box-shadow: 5px 5px 0 var(--black);
            border-radius: 12px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }
        .player-card.active-kira {
            background: var(--pink);
            color: var(--white);
            transform: rotate(-1.5deg) scale(1.02);
            box-shadow: 7px 7px 0 var(--black);
        }
        .player-card.active-vitya {
            background: var(--cyan);
            transform: rotate(1.5deg) scale(1.02);
            box-shadow: 7px 7px 0 var(--black);
        }
        .player-card.inactive { opacity: 0.55; }
        .player-avatar {
            width: 40px; height: 40px;
            border-radius: 8px;
            border: 2px solid var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .player-name {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            letter-spacing: -0.03em;
        }
        .player-score {
            font-family: 'Pixelify Sans', sans-serif;
            font-weight: 700;
            font-size: 26px;
            line-height: 1;
        }
        .turn-badge {
            font-family: 'Pixelify Sans', sans-serif;
            font-weight: 700;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 2px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        /* ========== STATUS LINE ========== */
        .status-line-wrap {
            flex-shrink: 0;
            text-align: center;
            padding-bottom: 8px;
        }
        .status-line {
            display: inline-block;
            padding: 5px 12px;
            background: var(--white);
            border: 2px solid var(--black);
            box-shadow: 3px 3px 0 var(--black);
            border-radius: 20px;
            font-family: 'Pixelify Sans', sans-serif;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
        }

        /* ========== GRID ========== */
        main {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 0 4px 8px 4px;
            overflow: hidden;
        }
        .grid-wrap {
            flex: 1;
            min-height: 0;
            background: var(--white);
            border: 3px solid var(--black);
            box-shadow: 5px 5px 0 var(--black);
            border-radius: 16px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #master-grid {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-auto-rows: 1fr;
            gap: 8px;
            overflow-y: auto;
        }

        .cat-col {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-height: 0;
        }
        .cat-header {
            flex-shrink: 0;
            border: 2px solid var(--black);
            box-shadow: 3px 3px 0 var(--black);
            border-radius: 6px;
            padding: 5px 6px;
            text-align: center;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            line-height: 1.3;
            text-transform: uppercase;
            color: var(--black);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tiers {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
        }

        /* ========== CELLS ========== */
        .cell {
            background: var(--white);
            border: 2px solid var(--black);
            box-shadow: 3px 3px 0 var(--black);
            border-radius: 6px;
            min-height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.1s ease;
            font-family: 'Pixelify Sans', sans-serif;
            font-weight: 700;
            font-size: 15px;
            color: var(--black);
            flex-shrink: 0;
        }
        .cell:active:not(.cell-done) {
            transform: translate(3px, 3px);
            box-shadow: 0 0 0 var(--black);
        }
        @media (hover: hover) {
            .cell:hover:not(.cell-done) {
                background: var(--yellow);
                transform: translate(-1px, -1px);
                box-shadow: 4px 4px 0 var(--black);
            }
            .cell:hover:not(.cell-done):active {
                transform: translate(3px, 3px);
                box-shadow: 0 0 0 var(--black);
            }
        }
        .cell-done {
            opacity: 0.28;
            pointer-events: none;
            background: var(--cream);
            box-shadow: none;
            border-style: dashed;
            border-color: #999;
            color: #999;
        }

        /* ========== DESKTOP HORIZONTAL STRIPS ========== */
        @media (min-width: 1024px) {
            #master-grid {
                display: flex !important;
                flex-direction: column;
                gap: 5px;
                overflow-y: hidden;
            }
            .cat-col {
                flex: 1;
                min-height: 0;
                display: grid;
                grid-template-columns: 150px repeat(10, 1fr);
                gap: 5px;
            }
            .cat-header {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                white-space: normal;
                font-size: 7px;
                line-height: 1.25;
                text-align: center;
                padding: 2px 4px;
            }
            .tiers {
                display: contents !important;
            }
            .cell {
                height: 100%;
                min-height: 0;
                font-size: 16px;
            }
        }
        @media (min-width: 1600px) {
            .cat-header { font-size: 8px; }
            .cell { font-size: 18px; }
        }

        /* ========== TABLET ========== */
        @media (min-width: 640px) and (max-width: 1023px) {
            #master-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .cat-header { font-size: 8px; }
            .cell { min-height: 44px; font-size: 16px; }
        }
        @media (min-width: 768px) and (max-width: 1023px) {
            #master-grid { grid-template-columns: repeat(4, 1fr); }
        }

        /* ========== SMALL ========== */
        @media (max-width: 480px) {
            .brand-title { font-size: 9px; }
            .brand-sub { font-size: 8px; }
            .brand-icon { width: 38px; height: 38px; font-size: 15px; }
            .top-btn { height: 36px; padding: 0 8px; font-size: 10px; }
            .player-avatar { width: 34px; height: 34px; font-size: 14px; }
            .player-name { font-size: 8px; }
            .player-score { font-size: 22px; }
            .cat-header { font-size: 7px; }
            .cell { min-height: 36px; font-size: 13px; }
        }

        /* ========== SHORT SCREEN ========== */
        @media (max-height: 600px) and (min-width: 1024px) {
            .cat-header { font-size: 6px; }
            .cell { font-size: 13px; }
            .players-row { padding-bottom: 6px; }
            .status-line-wrap { padding-bottom: 4px; }
        }

        /* ========== SCROLLBAR ========== */
        .tiers::-webkit-scrollbar, #master-grid::-webkit-scrollbar { width: 5px; height: 5px; }
        .tiers::-webkit-scrollbar-thumb, #master-grid::-webkit-scrollbar-thumb { background: var(--black); }
        .tiers::-webkit-scrollbar-track, #master-grid::-webkit-scrollbar-track { background: transparent; }

        /* ========== FOOTER ========== */
        footer {
            flex-shrink: 0;
            padding: 4px 4px 0 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .reset-btn {
            padding: 6px 12px;
            background: var(--red);
            color: var(--white);
            border: 2px solid var(--black);
            box-shadow: 3px 3px 0 var(--black);
            border-radius: 8px;
            font-family: 'Pixelify Sans', sans-serif;
            font-weight: 700;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }
        .reset-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--black); }
        .footer-tag {
            font-family: 'Pixelify Sans', sans-serif;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.5;
        }

        /* ========== BADGE ========== */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 2px solid var(--black);
            box-shadow: 2px 2px 0 var(--black);
            padding: 3px 8px;
            font-family: 'Pixelify Sans', sans-serif;
            font-weight: 700;
            font-size: 10px;
            text-transform: uppercase;
            color: var(--black);
            border-radius: 4px;
        }

        /* ========== MODAL ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            z-index: 50;
        }
        .modal-sheet {
            background: var(--white);
            border: 3px solid var(--black);
            border-bottom: none;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -8px 0 var(--black);
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: 14px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 95vh;
            overflow-y: auto;
            animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes pop-in {
            0% { transform: scale(0.5) rotate(-8deg); opacity: 0; }
            70% { transform: scale(1.05) rotate(2deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .pop-in { animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes pop-big { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        .pop-big { animation: pop-big 0.8s ease-in-out infinite; }

        .modal-handle {
            width: 60px; height: 5px;
            background: var(--black);
            border-radius: 4px;
            margin: 0 auto 4px;
        }
        .modal-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--black);
            gap: 8px;
            flex-wrap: wrap;
        }
        .modal-body { padding: 10px 0; text-align: center; }
        .modal-question {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 20px;
            line-height: 1.3;
            margin: 12px 0;
        }
        .modal-answer {
            background: var(--lime);
            border: 3px solid var(--black);
            border-radius: 10px;
            padding: 12px;
            text-align: left;
            margin-top: 12px;
        }
        .modal-answer-label {
            font-family: 'Pixelify Sans', sans-serif;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .modal-answer-text {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 15px;
            line-height: 1.35;
        }
        .warn-box {
            border: 3px solid var(--black);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            margin-top: 10px;
        }
        .warn-title {
            font-family: 'Pixelify Sans', sans-serif;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .warn-text {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 13px;
            line-height: 1.4;
        }

        .reveal-btn {
            width: 100%;
            padding: 14px;
            background: var(--yellow);
            border: 3px solid var(--black);
            box-shadow: 4px 4px 0 var(--black);
            border-radius: 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }
        .reveal-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--black); }

        .score-blocks {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .score-block {
            background: var(--white);
            border: 3px solid var(--black);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .score-block-locked { opacity: 0.3; pointer-events: none; }
        .score-block-active {
            background: var(--yellow);
            animation: pop-big 1.2s ease-in-out infinite;
        }
        .score-block-name {
            font-family: 'Pixelify Sans', sans-serif;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .score-btns {
            display: flex;
            gap: 6px;
        }
        .score-btn {
            flex: 1;
            padding: 10px 6px;
            border: 2px solid var(--black);
            box-shadow: 3px 3px 0 var(--black);
            border-radius: 8px;
            font-family: 'Pixelify Sans', sans-serif;
            font-weight: 700;
            font-size: 13px;
            color: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }
        .score-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--black); }
        .score-btn.plus { background: var(--green); }
        .score-btn.minus { background: var(--red); }

        .skip-btn {
            display: block;
            margin: 10px auto 0;
            font-family: 'Pixelify Sans', sans-serif;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-decoration: underline;
            opacity: 0.5;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .skip-btn:hover { opacity: 1; }

        /* ========== INSTANT / WINNER ========== */
        .center-modal {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 50;
        }
        .center-card {
            background: var(--white);
            border: 3px solid var(--black);
            box-shadow: 8px 8px 0 var(--black);
            border-radius: 20px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .center-icon {
            width: 100px; height: 100px;
            border: 3px solid var(--black);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin: 0 auto 16px;
        }
        .center-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 18px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .center-desc {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .center-btn {
            width: 100%;
            padding: 14px;
            background: var(--yellow);
            border: 3px solid var(--black);
            box-shadow: 4px 4px 0 var(--black);
            border-radius: 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }
        .center-btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--black); }
        .final-scores {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .final-score-box {
            border: 3px solid var(--black);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        .final-score-name {
            font-family: 'Pixelify Sans', sans-serif;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 6px;

    if (points <= 200) return { label: '<i class="fa-solid fa-seedling"></i> РАЗМИНКА' };

    return { label: '<i class="fa-solid fa-crown"></i> ХАРДКОР' };
}

function generateSpecialCells() {
    const map = {};
    const types = [
        { type: 'double', count: 6 },
        { type: 'trap', count: 6 },
        { type: 'jackpot', count: 3 },
        { type: 'block', count: 3 },
        { type: 'bonus', count: 5 },
        { type: 'penalty', count: 5 }
    ];
    const allKeys = [];
    categories.forEach(c => pointValues.forEach(p => allKeys.push(`${c.id}-${p}`)));
    for (let i = allKeys.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allKeys[i], allKeys[j]] = [allKeys[j], allKeys[i]];
    }
    let idx = 0;
    types.forEach(t => {
        for (let i = 0; i < t.count && idx < allKeys.length; i++, idx++) {
            map[allKeys[idx]] = { type: t.type };
        }
    });
    return map;
}

function getSpecialInfo(key) {
    const s = specialCells[key];
    if (!s) return null;
    if (s.type === 'double') return { icon: 'fa-gem', label: '×2', bg: '#4ECDC4' };
    if (s.type === 'trap') return { icon: 'fa-triangle-exclamation', label: 'ЛОВУШКА', bg: '#FF3D3D', white: true };

    if (s.type === 'bonus') return { icon: 'fa-dice', label: 'БОНУС', bg: '#A8FF3D' };

// ========== AUDIO ==========
let audioCtx = null;
function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}
function toggleAudioMute() {
    isAudioMuted = !isAudioMuted;
    const icon = document.getElementById('mute-icon');
    icon.className = isAudioMuted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
}
function playSound(type) {
    if (isAudioMuted) return;
    try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        if (type === 'click') {
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.frequency.setValueAtTime(500, now);
            o.frequency.exponentialRampToValueAtTime(900, now + 0.04);
            g.gain.setValueAtTime(0.05, now);
            g.gain.linearRampToValueAtTime(0.01, now + 0.04);
            o.start(now); o.stop(now + 0.04);
        } else if (type === 'reveal') {
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(400, now);
            o.frequency.exponentialRampToValueAtTime(700, now + 0.1);
            g.gain.setValueAtTime(0.08, now);
            g.gain.linearRampToValueAtTime(0.01, now + 0.1);
            o.start(now); o.stop(now + 0.1);
        } else if (type === 'correct') {
            [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.frequency.setValueAtTime(f, now + i * 0.05);
                g.gain.setValueAtTime(0.07, now + i * 0.05);
                g.gain.linearRampToValueAtTime(0.01, now + i * 0.05 + 0.12);
                o.start(now + i * 0.05); o.stop(now + i * 0.05 + 0.12);
            });
        } else if (type === 'wrong') {
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(220, now);
            o.frequency.linearRampToValueAtTime(80, now + 0.18);
            g.gain.setValueAtTime(0.08, now);
            g.gain.linearRampToValueAtTime(0.01, now + 0.18);
            o.start(now); o.stop(now + 0.18);
        } else if (type === 'win') {
            [440, 554.37, 659.25, 880, 1046.50].forEach((f, i) => {
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.type = 'triangle';
                o.frequency.setValueAtTime(f, now + i * 0.07);
                g.gain.setValueAtTime(0.1, now + i * 0.07);
                g.gain.linearRampToValueAtTime(0.01, now + i * 0.07 + 0.2);
                o.start(now + i * 0.07); o.stop(now + i * 0.07 + 0.2);
            });
        }
    } catch(e) {}
}

function applyDensity(mode) {
    document.body.setAttribute('data-density', mode);
    const icon = document.getElementById('density-icon');
    if (icon) icon.className = mode === 'comfortable' ? 'fa-solid fa-table-cells-large' : 'fa-solid fa-table-cells';
    try { localStorage.setItem(DENSITY_KEY, mode); } catch(e) {}
}
function toggleDensity() {
    const current = document.body.getAttribute('data-density') || 'comfortable';
    applyDensity(current === 'comfortable' ? 'compact' : 'comfortable');
    playSound('click');
}

    const btn = document.getElementById('density-btn');
    if (window.innerWidth >= 1024) btn.style.display = 'flex';
    else btn.style.display = 'none';
}

// ========== PERSISTENCE ==========
function loadState() {
    try {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) {
            const parsed = JSON.parse(data);
            if (parsed.playedQuestions) playedQuestions = new Set(parsed.playedQuestions);
            if (parsed.players) players = parsed.players;
            if (parsed.activePlayerIndex !== undefined) activePlayerIndex = parsed.activePlayerIndex;
            if (parsed.blockedPlayerIndex !== undefined) blockedPlayerIndex = parsed.blockedPlayerIndex;
            if (parsed.specialCells && Object.keys(parsed.specialCells).length > 0) {
                specialCells = parsed.specialCells;
            } else {
                specialCells = generateSpecialCells();
                saveState();
            }
        } else {
            specialCells = generateSpecialCells();
        }
    } catch (e) { specialCells = generateSpecialCells(); }
    try {
        const d = localStorage.getItem(DENSITY_KEY);
        applyDensity(d || 'comfortable');
    } catch(e) { applyDensity('comfortable'); }
}
function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            playedQuestions: Array.from(playedQuestions),
            players: players,
            activePlayerIndex: activePlayerIndex,
            blockedPlayerIndex: blockedPlayerIndex,
            specialCells: specialCells
        }));
    } catch (e) {}
}

// ========== GRID ==========
function initGrid() {
    const masterGrid = document.getElementById('master-grid');
    masterGrid.innerHTML = '';
    categories.forEach(cat => {
        const colDiv = document.createElement('div');
        colDiv.className = 'cat-col';
        const headerDiv = document.createElement('div');
        headerDiv.className = 'cat-header';
        headerDiv.style.background = cat.color;
        headerDiv.textContent = cat.name;
        colDiv.appendChild(headerDiv);
        const tiersDiv = document.createElement('div');
        tiersDiv.className = 'tiers';
        pointValues.forEach(points => {
            const key = `${cat.id}-${points}`;
            const isPlayed = playedQuestions.has(key);
            const btn = document.createElement('button');
            btn.className = `cell${isPlayed ? ' cell-done' : ''}`;
            btn.dataset.key = key;
            if (isPlayed) {
                btn.innerHTML = '<i class="fa-solid fa-check"></i>';
            } else {
                btn.textContent = points;
            }
            btn.onclick = () => openQuestion(btn, key, cat.id, cat.name, points);
            tiersDiv.appendChild(btn);
        });
        colDiv.appendChild(tiersDiv);
        masterGrid.appendChild(colDiv);
    });
    updateTurnUI();
}

// ========== TURN ==========
function updateTurnUI() {
    players.forEach((p, idx) => {
        const card = document.getElementById(`player-card-${idx}`);
        const badge = document.getElementById(`turn-badge-${idx}`);
        document.getElementById(`score-${idx}`).innerText = p.score;
        if (idx === activePlayerIndex) {
            card.className = `player-card ${idx === 0 ? 'active-kira' : 'active-vitya'}`;
            badge.classList.remove('hidden');
        } else {
            card.className = 'player-card inactive';
            badge.classList.add('hidden');
        }
    });
    const statusLine = document.getElementById('turn-status-line');
    let statusText = `Ход: ${players[activePlayerIndex].name}`;
    if (blockedPlayerIndex !== null) statusText += ` • ${players[blockedPlayerIndex].name} пропускает`;
    statusLine.innerHTML = statusText;
    updateScoreButtonStates();
}
function updateScoreButtonStates() {
    if (!currentQuestion) return;
    for (let i = 0; i < 2; i++) {
        const block = document.getElementById(`score-block-${i}`);
        const tag = document.getElementById(`turn-tag-${i}`);
        if (!block || !tag) continue;
        if (i === activePlayerIndex) {
            block.classList.remove('score-block-locked');
            block.classList.add('score-block-active');
            tag.classList.remove('hidden');
        } else {
            block.classList.add('score-block-locked');
            block.classList.remove('score-block-active');
            tag.classList.add('hidden');
        }
    }
}

// ========== QUESTION MODAL ==========
function openQuestion(btnEl, key, catId, catName, points) {
    if (playedQuestions.has(key) || btnEl.classList.contains('cell-done')) return;
    playSound('click');
    activeCellElement = btnEl;
    activeCellKey = key;
    const diffInfo = getDifficulty(points);
    const special = getSpecialInfo(key);

    if (special && (specialCells[key].type === 'bonus' || specialCells[key].type === 'penalty')) {
        const isBonus = specialCells[key].type === 'bonus';
        const delta = isBonus ? points : -points;
        players[activePlayerIndex].score += delta;
        if (isBonus) playSound('correct'); else playSound('wrong');
        showInstantModal(isBonus, delta);
        playedQuestions.add(key);
        if (activeCellElement) {
            activeCellElement.classList.add('cell-done');
            activeCellElement.innerHTML = '<i class="fa-solid fa-check"></i>';
        }
        saveState();
        updateTurnUI();
        return;
    }

    currentQuestion = {
        key: key, catId: catId, category: catName,
        points: parseInt(points),
        data: questionsDatabase[catId][points],
        special: special ? specialCells[key].type : null
    };
    document.getElementById('modal-category').innerText = catName;
    document.getElementById('modal-category').style.background = categories.find(c => c.id === catId).color;
    document.getElementById('modal-points').innerText = `${points} PTS`;
    document.getElementById('modal-difficulty-hint').innerHTML = diffInfo.label;
    document.getElementById('modal-player-turn').innerText = players[activePlayerIndex].name;
    document.getElementById('modal-question-text').innerText = currentQuestion.data.q;
    document.getElementById('modal-answer-text').innerText = currentQuestion.data.a;

    const specialBadge = document.getElementById('modal-special');
    if (special) {
        specialBadge.classList.remove('hidden');
        specialBadge.style.background = special.bg;
        specialBadge.style.color = special.white ? '#FFFFFF' : '#0A0A0A';
        specialBadge.innerHTML = `<i class="fa-solid ${special.icon}"></i> ${special.label}`;
    } else specialBadge.classList.add('hidden');

    const warnBox = document.getElementById('modal-special-warning');
    if (currentQuestion.special === 'double') {
        warnBox.style.background = 'var(--cyan)'; warnBox.style.color = '';
        warnBox.innerHTML = `<div class="warn-title"><i class="fa-solid fa-gem"></i> ×2 УДВОЕНИЕ</div><div class="warn-text">Верно → <strong>+${points * 2}</strong><br>Ошибка → <strong>-${points}</strong></div>`;
        warnBox.classList.remove('hidden');
    } else if (currentQuestion.special === 'trap') {
        warnBox.style.background = 'var(--red)'; warnBox.style.color = '#FFFFFF';
        warnBox.innerHTML = `<div class="warn-title"><i class="fa-solid fa-triangle-exclamation"></i> ЛОВУШКА</div><div class="warn-text">Верно → <strong>+${points}</strong><br>Ошибка → <strong>-${points * 2}</strong></div>`;
        warnBox.classList.remove('hidden');
    } else if (currentQuestion.special === 'jackpot') {
        warnBox.style.background = 'var(--purple)'; warnBox.style.color = '#FFFFFF';
        warnBox.innerHTML = `<div class="warn-title"><i class="fa-solid fa-gift"></i> ДЖЕКПОТ ×5</div><div class="warn-text">Верно → <strong>+${points * 5}</strong>!!!<br>Ошибка → <strong>-${points}</strong></div>`;
        warnBox.classList.remove('hidden');
    } else if (currentQuestion.special === 'block') {
        warnBox.style.background = '#6B7280'; warnBox.style.color = '#FFFFFF';
        warnBox.innerHTML = `<div class="warn-title"><i class="fa-solid fa-ban"></i> БЛОКИРОВКА</div><div class="warn-text">Соперник пропустит следующий ход!</div>`;
        warnBox.classList.remove('hidden');
    } else {
        warnBox.classList.add('hidden'); warnBox.style.color = '';
    }

    updateScoreButtonLabels();
    document.getElementById('modal-answer-box').classList.add('hidden');
    document.getElementById('action-reveal-container').classList.remove('hidden');
    document.getElementById('question-modal').classList.remove('hidden');
    updateScoreButtonStates();
}

function updateScoreButtonLabels() {
    const p = currentQuestion.points;
    const s = currentQuestion.special;
    let plusVal = p, minusVal = p;
    if (s === 'double') { plusVal = p * 2; minusVal = p; }
    else if (s === 'trap') { plusVal = p; minusVal = p * 2; }
    else if (s === 'jackpot') { plusVal = p * 5; minusVal = p; }
    document.getElementById('btn-kira-plus').innerText = `+${plusVal}`;
    document.getElementById('btn-kira-minus').innerText = `-${minusVal}`;
    document.getElementById('btn-vitya-plus').innerText = `+${plusVal}`;
    document.getElementById('btn-vitya-minus').innerText = `-${minusVal}`;
}
function revealAnswer() {
    playSound('reveal');
    document.getElementById('modal-answer-box').classList.remove('hidden');
    document.getElementById('action-reveal-container').classList.add('hidden');
}

// ========== INSTANT MODAL ==========
function showInstantModal(isBonus, delta) {
    const card = document.getElementById('instant-card');
    const icon = document.getElementById('instant-icon');
    const title = document.getElementById('instant-title');
    const desc = document.getElementById('instant-desc');
    if (isBonus) {
        card.style.background = 'var(--lime)';
        icon.innerHTML = '<i class="fa-solid fa-dice"></i>';
        icon.style.background = 'var(--white)';
        title.innerText = 'БОНУС!';
        desc.innerText = `${players[activePlayerIndex].name} получает +${delta} очков!`;
    } else {
        card.style.background = 'var(--orange)';
        icon.innerHTML = '<i class="fa-solid fa-burst"></i>';
        icon.style.background = 'var(--white)';
        title.innerText = 'ШТРАФ!';
        desc.innerText = `${players[activePlayerIndex].name} теряет ${Math.abs(delta)} очков!`;
    }
    document.getElementById('instant-modal').classList.remove('hidden');
}
function closeInstantModal() {
    document.getElementById('instant-modal').classList.add('hidden');
    let next = activePlayerIndex === 0 ? 1 : 0;
    if (blockedPlayerIndex !== null && next === blockedPlayerIndex) {
        blockedPlayerIndex = null;
        next = next === 0 ? 1 : 0;
    }
    activePlayerIndex = next;
    saveState();
    updateTurnUI();
    checkGameCompletion();
}

// ========== SCORING ==========
function scorePlayer(playerIdx, isCorrect) {
    if (!currentQuestion) return;
    if (playerIdx !== activePlayerIndex) { playSound('wrong'); return; }
    const p = currentQuestion.points;
    const s = currentQuestion.special;

    if (s === 'block') {
        blockedPlayerIndex = activePlayerIndex === 0 ? 1 : 0;
        playSound('correct');
        finishTurn(false);
        return;
    }

    let delta = 0;
    if (s === 'double') delta = isCorrect ? p * 2 : -p;
    else if (s === 'trap') delta = isCorrect ? p : -p * 2;
    else if (s === 'jackpot') delta = isCorrect ? p * 5 : -p;
    else delta = isCorrect ? p : -p;

    if (!isCorrect && Math.abs(delta) >= 400) {
        if (!confirm(`Списать ${Math.abs(delta)} очков у ${players[playerIdx].name}?`)) return;
    }
    if (isCorrect) playSound('correct'); else playSound('wrong');
    players[playerIdx].score += delta;
    finishTurn(!isCorrect);
}

function finishTurn(switchPlayer) {
    if (activeCellKey) playedQuestions.add(activeCellKey);
    if (activeCellElement) {
        activeCellElement.classList.add('cell-done');
        activeCellElement.innerHTML = '<i class="fa-solid fa-check"></i>';
    }
    if (switchPlayer) {
        let next = activePlayerIndex === 0 ? 1 : 0;
        if (blockedPlayerIndex !== null && next === blockedPlayerIndex) {
            blockedPlayerIndex = null;
            next = next === 0 ? 1 : 0;
        }
        activePlayerIndex = next;
    }
    saveState();
    updateTurnUI();
    closeQuestionModal(true);
}

function closeQuestionModal(skipDisable = false) {
    if (activeCellKey && !skipDisable) {
        playedQuestions.add(activeCellKey);
        if (activeCellElement) {
            activeCellElement.classList.add('cell-done');
            activeCellElement.innerHTML = '<i class="fa-solid fa-check"></i>';
        }
        let next = activePlayerIndex === 0 ? 1 : 0;
        if (blockedPlayerIndex !== null && next === blockedPlayerIndex) {
            blockedPlayerIndex = null;
            next = next === 0 ? 1 : 0;
        }
        activePlayerIndex = next;
        saveState();
        updateTurnUI();
    }
    document.getElementById('question-modal').classList.add('hidden');
    document.getElementById('modal-special-warning').classList.add('hidden');
    document.getElementById('modal-special').classList.add('hidden');
    activeCellElement = null;
    activeCellKey = null;
    currentQuestion = null;
    checkGameCompletion();
}
function closeModal(modalId) { document.getElementById(modalId).classList.add('hidden'); }
function checkGameCompletion() {
    const total = categories.length * pointValues.length;
    if (playedQuestions.size >= total) setTimeout(() => showWinnerModal(), 400);
}

function showWinnerModal() {
    playSound('win');
    let winnerText = "", winnerScoreText = "";
    if (players[0].score > players[1].score) { winnerText = "КИРА ПОБЕДИЛА!"; winnerScoreText = `С результатом ${players[0].score} очков`; }
    else if (players[1].score > players[0].score) { winnerText = "ВИТЯ ПОБЕДИЛ!"; winnerScoreText = `С результатом ${players[1].score} очков`; }
    else { winnerText = "НИЧЬЯ!"; winnerScoreText = `Оба набрали по ${players[0].score} очков`; }
    document.getElementById('winner-name').innerText = winnerText;
    document.getElementById('winner-score').innerText = winnerScoreText;
    document.getElementById('final-score-0').innerText = players[0].score;
    document.getElementById('final-score-1').innerText = players[1].score;
    document.getElementById('winner-modal').classList.remove('hidden');
    if (window.confetti) {
        const duration = 3500, end = Date.now() + duration;
        (function frame() {
            confetti({ particleCount: 8, angle: 60, spread: 60, origin: { x: 0 }, colors: ['#FF5C8A', '#FFD93D', '#4ECDC4', '#A8FF3D', '#FF8C42'] });
            confetti({ particleCount: 8, angle: 120, spread: 60, origin: { x: 1 }, colors: ['#FF5C8A', '#FFD93D', '#4ECDC4', '#A8FF3D', '#FF8C42'] });
            if (Date.now() < end) requestAnimationFrame(frame);
        })();
    }
}

function resetGame(confirmReset = false) {
    if (confirmReset && !confirm("Сбросить игру? Позиции спецячеек перемешаются!")) return;
    playSound('click');
    players[0].score = 0;
    players[1].score = 0;
    activePlayerIndex = 0;
    blockedPlayerIndex = null;
    playedQuestions.clear();
    specialCells = generateSpecialCells();
    localStorage.removeItem(STORAGE_KEY);
    saveState();
    initGrid();
}

window.onload = function() {
    loadState();
    initGrid();
    updateDensityVisibility();
};
</script>
</body>
